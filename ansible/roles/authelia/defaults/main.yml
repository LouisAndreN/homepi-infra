authelia_sops_file: "{{ playbook_dir }}/secrets/authelia.sops.yaml"
# rstrip=false keeps the final newline, so the files stay byte-identical to the adopted ones
authelia_env_content: "{{ lookup('community.sops.sops', authelia_sops_file, extract='[\"authelia_env\"]', rstrip=false) }}"
authelia_users_content: "{{ lookup('community.sops.sops', authelia_sops_file, extract='[\"authelia_users_database\"]', rstrip=false) }}"
# Files the role writes, kept as a rollback copy when they exist (owner is also the group)
authelia_rollback_files:
  - {name: configuration.yml, dest: /etc/authelia/configuration.yml, owner: authelia, mode: "0640"}
  - {name: authelia.env, dest: /var/lib/secrets/authelia.env, owner: root, mode: "0600"}
  - {name: users_database.yml, dest: /etc/authelia/users_database.yml, owner: authelia, mode: "0640"}
