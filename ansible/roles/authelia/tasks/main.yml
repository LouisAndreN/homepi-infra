# Authelia: configuration without secrets, secrets environment and users from SOPS, drop-in.
# A change restarts Authelia, then health and the storage key are checked; on failure the
# previous files are restored. See docs/runbooks/authelia.md.
- name: Rollback copy directory
  ansible.builtin.file:
    path: /var/backups/authelia
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Authelia files present before the change (a rebuilt Pi has no users database until SOPS writes it)
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    get_checksum: false
  loop: "{{ authelia_rollback_files }}"
  loop_control:
    label: "{{ item.name }}"
  register: authelia_prev

- name: Authelia change with rollback
  block:
    - name: Keep the current files as the rollback copy
      ansible.builtin.copy:
        src: "{{ item.dest }}"
        dest: "/var/backups/authelia/{{ item.name }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ authelia_rollback_files }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: authelia_i
      no_log: true
      when: (not ansible_check_mode) and authelia_prev.results[authelia_i].stat.exists

    # A copy left by an earlier run must not come back over a file that did not exist before this one
    - name: No stale rollback copy for a file that does not exist yet
      ansible.builtin.file:
        path: "/var/backups/authelia/{{ item.name }}"
        state: absent
      loop: "{{ authelia_rollback_files }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: authelia_i
      when: (not ansible_check_mode) and not authelia_prev.results[authelia_i].stat.exists

    - name: Authelia configuration (no secret inside)
      ansible.builtin.copy:
        src: configuration.yml
        dest: /etc/authelia/configuration.yml
        owner: authelia
        group: authelia
        mode: "0640"
      register: authelia_cfg

    - name: Authelia secrets environment (SOPS)
      ansible.builtin.copy:
        content: "{{ authelia_env_content }}"
        dest: /var/lib/secrets/authelia.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: authelia_env

    - name: Authelia users database (SOPS)
      ansible.builtin.copy:
        content: "{{ authelia_users_content }}"
        dest: /etc/authelia/users_database.yml
        owner: authelia
        group: authelia
        mode: "0640"
      no_log: true
      register: authelia_users

    - name: Authelia drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/authelia.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Authelia drop-in loading the secrets environment
      ansible.builtin.copy:
        src: authelia-secrets.conf
        dest: /etc/systemd/system/authelia.service.d/secrets.conf
        owner: root
        group: root
        mode: "0644"
      register: authelia_dropin

    - name: Restart Authelia after a change
      ansible.builtin.systemd:
        name: authelia
        state: restarted
        daemon_reload: true
      when: (not ansible_check_mode) and (authelia_cfg is changed or authelia_env is changed or authelia_users is changed or authelia_dropin is changed)

    - name: Authelia enabled and running
      ansible.builtin.systemd:
        name: authelia
        enabled: true
        state: started

    - name: Authelia answers on its health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9091/api/health
        status_code: 200
      register: authelia_health
      retries: 15
      delay: 2
      until: authelia_health.status == 200
      when: not ansible_check_mode

    - name: Storage encryption key opens the database
      ansible.builtin.command:
        argv: [systemd-run, --quiet, --wait, --pipe, --collect, -p, User=authelia, -p, Group=authelia,
               -p, "EnvironmentFile=/var/lib/secrets/authelia.env", /usr/bin/authelia, storage, encryption, check,
               --config, /etc/authelia/configuration.yml]
        chdir: /
      register: authelia_storage
      changed_when: false
      failed_when: "'SUCCESS' not in authelia_storage.stdout"
      when: not ansible_check_mode

  rescue:
    - name: Restore the previous Authelia files (only those that existed before the change)
      ansible.builtin.copy:
        src: "/var/backups/authelia/{{ item.name }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop: "{{ authelia_rollback_files }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: authelia_i
      no_log: true
      when: authelia_prev.results[authelia_i].stat.exists

    - name: Restart Authelia on the previous files
      ansible.builtin.systemd:
        name: authelia
        state: restarted
        daemon_reload: true

    - name: Report the rollback
      ansible.builtin.fail:
        msg: "Authelia change failed and was rolled back to the previous files. See docs/runbooks/authelia.md."
