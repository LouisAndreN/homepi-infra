#!/usr/sbin/nft -f

# Replace only the static policy, atomically: CrowdSec, NetBird, Docker and netfilter-persistent own
# the other tables (until v0.1.49, `flush ruleset` here wiped them on every reload)
destroy table inet filter
# Removes the homepi_nat table added in v0.1.50 and reverted in v0.1.51; harmless when absent.
# The IoT egress NAT stays in netfilter-persistent (rules.v4) until the egress canary can prove a move.
destroy table ip homepi_nat

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# ループバックと確立済み接続を許可 / Allow loopback & established
		iifname "lo" accept
		ct state { established, related } accept

		# Netbird WireGuard 制御ポート / Netbird control port
		udp dport 51820 accept comment "Netbird WireGuard"

		# SSH - LANおよびNetbirdからのみ / SSH only from LAN and Netbird
		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 22 accept comment "SSH LAN"
		iifname "wt0" tcp dport 22 accept comment "SSH Netbird"

		# DNS - LAN
		iifname "eth0" ip saddr 192.168.0.0/24 udp dport 53 accept comment "DNS LAN"
		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 53 accept comment "DNS LAN"

		# DNS - Netbird
		iifname "wt0" udp dport 53 accept comment "DNS Netbird"
		iifname "wt0" tcp dport 53 accept comment "DNS Netbird"

		# Nginx (HTTPS) - Everything go through this
		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 443 accept comment "HTTPS LAN"
		iifname "wt0" tcp dport 443 accept comment "HTTPS Netbird"

		# HTTP redirect - LAN and Netbird
		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 80 accept comment "HTTP redirect LAN"
		iifname "wt0" tcp dport 80 accept comment "HTTP redirect Netbird"

		# IoTサブネットからeth0 IPへの接続アクセスをブロック / Block access to eth0 IP from IoT subnet
		iifname "wlx0013eff27090" ip daddr 192.168.0.151 drop comment "Block Pi eth0 from IoT"

		# Grafana & InfluxDB access - NetbirdおよびLANのみ / Grafana & InfluxDB access - Netird and LAN only
#		iifname "wt0" tcp dport { 3000, 8086 } accept comment "Grafana & influxDB Netbird"
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 3000 accept comment "Grafana LAN"

		# Node Exporter - temporary direct access
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 9100 accept comment "Node Exporter LAN"
#		iifname "wt0" tcp dport 9100 accept comment "Node Exporter Netbird"

		# Prometheus - temporary direct access (LAN + NetBird)
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 9090 accept comment "Prometheus LAN"
#		iifname "wt0" tcp dport 9090 accept comment "Prometheus Netbird"

		# Alertmanager - temporary direct-access
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 9093 accept comment "Alertmanager LAN"
#		iifname "wt0" tcp dport 9093 accept comment "Alertmanager Netbird"

		# Loki - temporary direct-access
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 3100 accept comment "Loki LAN"
#		iifname "wt0" tcp dport 3100 accept comment "Loki Netbird"

		# UI Alloy - temporary direct-access
#		iifname "eth0" ip saddr 192.168.0.0/24 tcp dport 12345 accept comment "Alloy UI LAN"
#		iifname "wt0" tcp dport 12345 accept comment "Alloy UI Netbird"

		# MQTT plaintext - IoT subnet only
		iifname "wlx0013eff27090" tcp dport 1883 accept comment "MQTT センサー"
		# MQTT TLS - IoT subnet only
		iifname "wlx0013eff27090" tcp dport 8883 accept comment "MQTT TLS IoT subnet"

		iifname "wlx0013eff27090" tcp dport 8086 accept comment "InfluxDB センサー"
		iifname "wlx0013eff27090" udp dport 67 accept comment "DHCP センサー"
		iifname "wlx0013eff27090" udp dport 53 accept comment "DNS センサー"

		# NTP - IoT VLAN　のみ（Piがローカルサーバー）
		# NTP - IoT VLAN only (Pi serves as local NTP server)
		iifname "wlx0013eff27090" udp dport 123 accept comment "NTP IoT VLAN local"

		# step-ca - accessible only from VLAN IoT
		ip saddr 192.168.200.0/24 tcp dport 8443 ct state new accept comment "step-ca IoT VLAN"

		# Provisioning IoT - HTTPS Nginx + API
		iifname "wlx0013eff27090" tcp dport { 443 } ct state new,established accept comment "IoT provisioning"

		# デバッグ用ICMP（レート制限）/ ICMP for debugging (rate-limited)
		icmp type echo-request limit rate 5/second accept comment "Ping デバッグ"

		# Log and drop
		log prefix "NFT-DROP-INPUT: " flags all counter drop comment "Input unmatched drop log / INPUTー一致なしドロップログ"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;

		# IoT -> LAN完全遮断 / IoT -> LAN blocked
		iifname "wlx0013eff27090" oifname "eth0" ip daddr 192.168.0.0/24 drop comment "Block IoT -> LAN / IoT -> LAN遮断"

		# Strict egress from IoT -> Internet (Unbound only + OTA essentials)
		# IoTからのアウトバウンドを厳格制限(Unbound のみ + OTA必要最低限)

		# NTP -> for time sync (often required for HTTPS OTA) / NTP -> 時刻同期(HTTPS OTAにしばしば必要)
		# iifname "wlx0013eff27090" oifname "eth0" udp dport 123 accept comment "NTP outbound / NTPアウトバウンド"

		# HTTPS -> for OTA, firmware, libraries (GitHub, ArduinoOTA, custom server, etc.)
		# HTTPS -> OTA, ファームウェア、ライブラリ更新用（GitHub、ArduinoOTA、カスタムサーバー等）
		iifname "wlx0013eff27090" oifname "eth0" tcp dport 443 accept comment "HTTPS outbound for OTA/firmware/libraries / OTA/ファームウエア/ライブラリ用HTTPS"
		iifname "wlx0013eff27090" oifname "eth0" tcp dport 80 accept comment "HTTP outbound (legacy OTA) / HTTPアウトバウンド（レガシーOTA）"

		# ICMP outbound from IoT (ping to Internet) / ICMPアウトバウンド（Internetへのping）
		iifname "wlx0013eff27090" oifname "eth0" icmp type echo-request accept comment "ICMP outbound from IoT / IoTからのICMPアウトバウンド"

		# Allow return traffic from Internet -> IoT / インターネットからの戻りトラフィック許可
		iifname "eth0" oifname "wlx0013eff27090" ct state { established, related } accept comment "Return traffic for allowed outbound / 許可済みアウトバウンドの戻りトラフィック"

		# Drop everything else outbound from IoT / IoTからのそれ以外のアウトバウンドをすべてドロップ
		iifname "wlx0013eff27090" oifname "eth0" drop comment "Strict egress drop - everything else blocked / 厳格アウトバウンドドロップ - それ以外のすべてブロック"

		# Log and drop unmatched forward / 一致しないFORWARDをログ記録してドロップ
		log prefix "NFT-DROP-FORWARD: " flags all counter drop comment "Forward unmatched drop log / FORWARD一致なしドロップログ"
	}
	chain output {
		type filter hook output priority filter; policy accept;
		# Output is allowed by default / OUTはデフォルトで許可
	}
}
