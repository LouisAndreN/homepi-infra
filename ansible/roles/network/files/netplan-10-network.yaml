network:
  version: 2
  renderer: networkd

  ethernets:
    eth0:
      dhcp4: false
      dhcp6: false
      # Static: SSH, Unbound, nftables, the DNS check and the LAN DNS setting of the whole house depend
      # on this address. DHCP lost it after a disk change (C3, 2026-11-21). The router keeps a
      # reservation for this MAC so that it never hands the address to another device.
      addresses: [192.168.0.151/24]
      routes:
        - to: default
          via: 192.168.0.1
      optional: true
