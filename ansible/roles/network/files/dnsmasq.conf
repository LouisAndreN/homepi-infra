# Interface IoT uniquement
#interface=wlx0013eff27090
listen-address=192.168.200.1
bind-interfaces

# DHCP for sensors
dhcp-range=192.168.200.100,192.168.200.200,255.255.255.0,24h

# Gateway and DNS for sensors
dhcp-option=option:router,192.168.200.1
dhcp-option=option:dns-server,192.168.200.1

# Forward DNS to local Unbound
server=127.0.0.1#53
no-resolv

# Log DHCP
log-dhcp
dns-forward-max=300
