---
# Admin scripts: audit, triage and backups. Root only, as they read secrets and state.
- name: Install the HomePi admin scripts
  ansible.builtin.copy:
    src: "sbin/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - homepi-audit
    - homepi-authelia-check
    - homepi-alloy-check
    - homepi-backup-influx-lp
    - homepi-backup-influx-native
    - homepi-backup-influx-delta
    - homepi-backup-run
    - homepi-backup-state
    - homepi-cli-check
    - homepi-docker-check
    - homepi-kernel-trial
    - homepi-sqlite-write-probe
    - homepi-netbird-check
    - homepi-telegraf-check
    - homepi-triage
    - homepi-upgrade
    - homepi-wifi-check

# Metric collectors that write node_exporter textfiles (certificate expiry, NetBird, zram)
- name: Install the metric collector scripts
  ansible.builtin.copy:
    src: "bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - homepi-cert-expiry.sh
    - homepi-netbird-status.sh
    - zram-metrics.sh

- name: Create the backup configuration directory
  ansible.builtin.file:
    path: /etc/homepi-backup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the backup recipients (public keys only)
  ansible.builtin.copy:
    dest: /etc/homepi-backup/recipients
    content: "{{ homepi_backup_recipients | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Install the Influx CLI config of the backups (token decrypted on the controller)
  vars:
    influx_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/influx.sops.yaml') | from_yaml }}"
  no_log: true
  ansible.builtin.template:
    src: influx-configs.j2
    dest: /etc/homepi-backup/influx-configs
    owner: root
    group: root
    mode: "0600"

- name: Install the collector units and timers
  ansible.builtin.copy:
    src: "systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ homepi_tools_units }}"
  register: homepi_tools_unit_files

- name: Reload systemd when a collector unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: homepi_tools_unit_files is changed

- name: Enable and start the collector timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ homepi_tools_timers }}"
  # In check mode a timer installed by this same run does not exist yet: skip only that one
  when: not ansible_check_mode or item not in (homepi_tools_unit_files.results | selectattr('changed') | map(attribute='item') | list)
