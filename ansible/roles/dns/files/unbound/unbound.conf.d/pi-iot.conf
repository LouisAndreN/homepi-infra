server:
    # Listen locally only
    interface: 127.0.0.1
    interface: 192.168.0.151  # eth0 LAN
    # Bind the LAN address even before it exists: without it, Unbound did not start at all when the
    # Pi came up on another address, and the Pi had no DNS for a night (C3, 2026-11-22)
    ip-freebind: yes
    #interface: 100.116.35.149@53  # wt0 Netbird
    #ip-transparent: yes         # bind even if wt0 not mounted yet
    port: 53

    # Access control by subnet
    access-control: 0.0.0.0/0 refuse
#    access-control: 127.0.0.0/8 allow
#    access-control: 192.168.0.0/24 allow
#    access-control: 100.64.0.0/10 allow   # Netbird CGNAT range

    # Assign views by subnet
    access-control-view: 127.0.0.0/8 lan
    access-control-view: 192.168.0.0/24 lan
    access-control-view: 100.64.0.0/10 netbird

    # Local records homepi.internal
#    local-zone: "homepi.internal." static
#    local-data: "homepi.internal. 60 IN A 100.116.35.149"
#    local-data: "auth.homepi.internal. 60 IN A 100.116.35.149"
#    local-data-ptr: "100.116.35.149 homepi.internal"

    # Peformances
    prefetch: yes
    cache-min-ttl: 0              # honour record TTLs (was 3600)
    serve-expired: yes            # RFC 8767: stale answer only when upstream fails
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    cache-max-ttl: 86400

    # Security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes

    # DNSSEC
#    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Logs
    verbosity: 1

view:
    name: "lan"
    view-first: yes
    local-zone: "homepi.internal." static
    local-data: "homepi.internal. 60 IN A 192.168.0.151"
    local-data: "auth.homepi.internal. 60 IN A 192.168.0.151"
#    local-data-ptr: "192.168.0.151 homepi.internal"

view:
    name: "netbird"
    view-first: yes
    local-zone: "homepi.internal." static
    local-data: "homepi.internal. 60 IN A 100.116.35.149"
    local-data: "auth.homepi.internal. 60 IN A 100.116.35.149"
#    local-data-ptr: "100.116.35.149 homepi.internal"
