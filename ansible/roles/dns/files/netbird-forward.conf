# Managed by Ansible (role dns).
# Unbound is the resolver of the Pi. Only NetBird peer names (netbird.cloud) are forwarded to the
# NetBird client's resolver, which listens on the Pi's NetBird address. If NetBird is down, only
# these names fail; every other name keeps resolving.
# netbird.cloud is not DNSSEC-signed (checked 2026-11-07), so validation does not reject the answers.
forward-zone:
    name: "netbird.cloud."
    forward-addr: 100.116.35.149
