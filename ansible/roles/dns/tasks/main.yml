---
# DNS of the Pi (A4). Unbound is the system resolver and forwards only netbird.cloud to the NetBird
# client's resolver; NetBird no longer manages /etc/resolv.conf. If NetBird is down, only NetBird
# peer names fail. Switched by hand once on 2026-11-07 (detached, with rollback), managed here since.
- name: Forward netbird.cloud to the NetBird resolver (Unbound drop-in)
  ansible.builtin.copy:
    src: netbird-forward.conf
    dest: /etc/unbound/unbound.conf.d/netbird-forward.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart unbound

- name: Unbound configuration (main file and drop-ins)
  ansible.builtin.copy:
    src: "unbound/{{ item }}"
    dest: "/etc/unbound/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [unbound.conf, unbound.conf.d/pi-iot.conf, unbound.conf.d/remote-control.conf, unbound.conf.d/root-auto-trust-anchor-file.conf]
  register: dns_unbound_files
  notify: Restart unbound

- name: Unbound configuration is valid (before any restart)
  ansible.builtin.command:
    argv: [unbound-checkconf]
    chdir: /
  changed_when: false
  check_mode: false

- name: Unbound restarted now if its configuration changed
  ansible.builtin.meta: flush_handlers

# A new Pi whose Unbound does not answer yet must not lose its DNS. The check runs after the Unbound
# configuration is in place: on a rebuilt Pi (C3, R4, 2026-11-21) it ran before pi-iot.conf existed,
# so homepi.internal could not resolve, and the first queries of a freshly started Unbound (trust
# anchor priming) timed out. Each name gets five tries; a failed dig is retried, not fatal at once.
- name: Check that Unbound answers before making it the system resolver
  ansible.builtin.command: "dig +short +time=3 +tries=1 {{ item }} @127.0.0.1"
  loop:
    - hooks.slack.com
    - homepi.internal
  register: dns_unbound_check
  changed_when: false
  check_mode: false
  failed_when: false
  until: dns_unbound_check.rc == 0 and dns_unbound_check.stdout | length > 0
  retries: 5
  delay: 3

- name: Stop if Unbound does not answer
  ansible.builtin.fail:
    msg: "Unbound does not answer for {{ item.item }} (rc {{ item.rc }}): /etc/resolv.conf is left unchanged"
  loop: "{{ dns_unbound_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0 or item.stdout | length == 0

- name: Find the NetBird client configuration
  ansible.builtin.stat:
    path: /var/lib/netbird/default.json
  register: dns_netbird_config

# The file holds the NetBird private keys: never logged, only DisableDNS is used
- name: Read the NetBird client configuration
  ansible.builtin.slurp:
    src: /var/lib/netbird/default.json
  register: dns_netbird_raw
  when: dns_netbird_config.stat.exists
  no_log: true

- name: Stop NetBird from managing the system DNS
  ansible.builtin.shell: netbird down && netbird up --disable-dns
  when:
    - dns_netbird_config.stat.exists
    - not ((dns_netbird_raw.content | b64decode | from_json).DisableDNS | default(false))

- name: Point the system resolver at Unbound
  ansible.builtin.copy:
    src: resolv.conf
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: DNS checker
  ansible.builtin.copy:
    src: homepi-dns-check
    dest: /usr/local/sbin/homepi-dns-check
    owner: root
    group: root
    mode: "0755"
  register: dns_checker

- name: DNS answers per view, IoT path and DNSSEC validation
  ansible.builtin.command:
    argv: [/usr/local/sbin/homepi-dns-check, 192.168.0.151, 100.116.35.149, 192.168.200.1]
    chdir: /
  register: dns_state
  changed_when: false
  check_mode: false
  retries: 3
  delay: 3
  until: dns_state.rc == 0
  when: not (ansible_check_mode and (dns_checker is changed or dns_unbound_files is changed))
