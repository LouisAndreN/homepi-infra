# MQTT device ACL rendered from the device registry (allow-list). See docs/runbooks/mqtt-acl.md.
- name: ACL sync script
  ansible.builtin.copy:
    src: homepi-acl-sync
    dest: "{{ mqtt_acl_sync }}"
    owner: root
    group: root
    mode: "0755"

- name: ACL sync units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [homepi-acl-sync.service, homepi-acl-sync.timer]
  register: mqtt_acl_units

- name: Reload systemd after a unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: mqtt_acl_units is changed

- name: ACL sync timer enabled and running
  ansible.builtin.systemd:
    name: homepi-acl-sync.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and mqtt_acl_units is changed)

- name: Deployed device ACL
  ansible.builtin.slurp:
    src: "{{ mqtt_acl_file }}"
  register: mqtt_acl_current

- name: Device ACL is the generated allow-list (no pattern rule)
  ansible.builtin.assert:
    that:
      - (mqtt_acl_current.content | b64decode).startswith('# Generated by homepi-acl-sync')
      - "'pattern ' not in (mqtt_acl_current.content | b64decode)"
    fail_msg: "{{ mqtt_acl_file }} is not the generated allow-list. See docs/runbooks/mqtt-acl.md."
    quiet: true
