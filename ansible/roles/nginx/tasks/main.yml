---
# nginx: the main site and the client CA chain are applied (nginx -t, reload, checks through nginx,
# automatic rollback); the other loaded files, the enabled-site links and the TLS files are verified only.

- name: nginx applied files differ from the Pi? (check mode only)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ nginx_apply_files }}"
  loop_control:
    label: "{{ item.dest }}"
  check_mode: true
  register: nginx_apply_probe

- name: nginx InfluxDB token snippet differs from SOPS? (check mode only, content never shown)
  ansible.builtin.copy:
    content: 'proxy_set_header Authorization "Token {{ nginx_influx_token }}";'
    dest: "{{ nginx_influx_auth_snippet }}"
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  no_log: true
  register: nginx_secret_probe

- name: Apply the nginx site and the client CA chain, rolling back on any failure
  when: nginx_apply_probe is changed or nginx_secret_probe is changed
  block:
    - name: Install the nginx InfluxDB token snippet (before the site that includes it)
      ansible.builtin.copy:
        content: 'proxy_set_header Authorization "Token {{ nginx_influx_token }}";'
        dest: "{{ nginx_influx_auth_snippet }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      no_log: true
      register: nginx_secret_install

    - name: Install the nginx applied files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
        backup: true
      loop: "{{ nginx_apply_files }}"
      loop_control:
        label: "{{ item.dest }}"
      register: nginx_apply_install

    - name: nginx configuration test after the change
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Routes answer through nginx after the reload
      ansible.builtin.command:
        argv: [curl, -sk, -o, /dev/null, -w, "%{http_code}", --max-time, "5", --resolve, "homepi.internal:443:127.0.0.1", "https://homepi.internal{{ item.path }}"]
      loop: "{{ nginx_health_checks }}"
      loop_control:
        label: "{{ item.path }} -> {{ item.status }}"
      register: nginx_health
      changed_when: false
      retries: 5
      delay: 2
      until: nginx_health.stdout == item.status
      when: not ansible_check_mode

  rescue:
    - name: Restore the previous nginx InfluxDB token snippet
      ansible.builtin.copy:
        src: "{{ nginx_secret_install.backup_file }}"
        dest: "{{ nginx_influx_auth_snippet }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: nginx_secret_install.backup_file is defined

    - name: Restore the previous nginx files
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ (nginx_apply_install.results | default([])) | selectattr('backup_file', 'defined') | list }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: nginx configuration test after the rollback
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx with the previous files
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Report the rollback
      ansible.builtin.fail:
        msg: >-
          nginx change failed and was rolled back:
          {{ ansible_failed_result.msg | default('see the failed task above') }}

- name: Other nginx files match the repository (check mode only)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ nginx_files }}"
  loop_control:
    label: "{{ item.dest }}"
  check_mode: true
  register: nginx_files_state

- name: nginx enabled sites link to the adopted files (check mode only)
  ansible.builtin.file:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    state: link
  loop: "{{ nginx_links }}"
  loop_control:
    label: "{{ item.path }}"
  check_mode: true
  register: nginx_links_state

- name: nginx TLS files present with the expected owner and mode (content never read)
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
    get_mime: false
  loop: "{{ nginx_stat_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: nginx_stat_state

- name: nginx configuration test (read-only)
  ansible.builtin.command: nginx -t
  check_mode: false
  changed_when: false
  failed_when: false
  register: nginx_test

- name: nginx service enabled and running (check mode only)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ nginx_services }}"
  check_mode: true
  register: nginx_services_state

- name: Collect nginx drift
  ansible.builtin.set_fact:
    nginx_drift: >-
      {%- set d = [] -%}
      {%- for r in nginx_files_state.results if r is changed -%}{%- set _ = d.append(r.item.dest) -%}{%- endfor -%}
      {%- for r in nginx_links_state.results if r is changed -%}{%- set _ = d.append(r.item.path ~ ' link') -%}{%- endfor -%}
      {%- for r in nginx_stat_state.results -%}
      {%- if not r.stat.exists -%}{%- set _ = d.append(r.item.path ~ ' missing') -%}
      {%- elif r.stat.pw_name != r.item.owner or r.stat.gr_name != r.item.group or r.stat.mode != r.item.mode -%}{%- set _ = d.append(r.item.path ~ ' is ' ~ r.stat.pw_name ~ ':' ~ r.stat.gr_name ~ ' ' ~ r.stat.mode) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if nginx_test.rc != 0 -%}{%- set _ = d.append('nginx -t fails') -%}{%- endif -%}
      {%- for r in nginx_services_state.results if r is changed -%}{%- set _ = d.append('service ' ~ r.item) -%}{%- endfor -%}
      {{ d }}

- name: Show nginx drift
  ansible.builtin.debug:
    msg: "nginx drift: {{ nginx_drift | join(' | ') if nginx_drift else 'none' }}"

- name: Fail on nginx drift
  ansible.builtin.fail:
    msg: "nginx drift detected: {{ nginx_drift | join(' | ') }}. See docs/runbooks/nginx-api.md."
  when: nginx_drift | length > 0
