---
# Handlers run at the end of the play, after the observability role has written the units and configs
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted

- name: Restart loki
  ansible.builtin.systemd_service:
    name: loki
    state: restarted
