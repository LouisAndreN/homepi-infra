---
- name: Install the packages the release archives need
  ansible.builtin.apt:
    name: "{{ monitoring_packages }}"
    state: present

- name: Create the service accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    shell: /bin/false
    home: "/home/{{ item.name }}"
    create_home: false
  loop: "{{ monitoring_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the directories for binaries and downloads
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/prometheus
    - /opt/alertmanager
    - "{{ monitoring_cache_dir }}"

- name: Check and install each pinned release
  ansible.builtin.include_tasks: release.yml
  loop: "{{ monitoring_releases | dict2items }}"
  loop_control:
    loop_var: rel
    label: "{{ rel.key }} {{ rel.value.version }}"

- name: Link prometheus and promtool into /usr/local/bin
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop: "{{ monitoring_symlinks }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Remove binaries left over by earlier manual installs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ monitoring_obsolete_files }}"
