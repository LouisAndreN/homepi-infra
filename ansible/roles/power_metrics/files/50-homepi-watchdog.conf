# v0.1.122: systemd feeds the hardware watchdog (bcm2835-wdt, dtparam=watchdog=on). If PID 1 stops
# feeding it for 15 s (a hung system), the SoC resets. 15 s is the limit of this watchdog. Until
# v0.1.122 RuntimeWatchdogUSec was 0: a hung Pi stayed hung. RebootWatchdogSec bounds a stuck
# shutdown. docs/runbooks/power.md.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=10min
