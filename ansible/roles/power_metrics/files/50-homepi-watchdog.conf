# v0.1.122: systemd feeds the hardware watchdog (bcm2835-wdt, dtparam=watchdog=on). If PID 1 stops
# feeding it (a hung system), the SoC resets. v0.1.123: 10 s, what the Pi 5 watchdog actually runs
# (asked for 15 s in v0.1.122, /sys/class/watchdog/watchdog0/timeout showed 10). Until v0.1.122
# RuntimeWatchdogUSec was 0: a hung Pi stayed hung. RebootWatchdogSec bounds a stuck shutdown.
# docs/runbooks/power.md.
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=10min
