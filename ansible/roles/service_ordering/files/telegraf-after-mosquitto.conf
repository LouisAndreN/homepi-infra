# Managed by Ansible (service_ordering).
# Telegraf exits when an mqtt_consumer cannot connect at start (measured 2026-11-07: connection refused at 21.1 s).
# Start it after the broker, and if it still exits (broker restart), retry every 10 s without limit.
[Unit]
After=mosquitto.service
Wants=mosquitto.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
