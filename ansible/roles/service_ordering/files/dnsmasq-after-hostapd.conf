# Managed by Ansible (service_ordering). dnsmasq binds the IoT access point address
# (bind-interfaces): started before hostapd brings the interface up, it exits with
# "Cannot assign requested address" and stays dead (C4 drill reboot, 2026-11-22: failed at
# 17.733 s, interface UP at 17.737 s). Order it after hostapd and retry until the address exists.
[Unit]
After=hostapd.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
