# Managed by Ansible (service_ordering).
# step-ca is "started" before it serves HTTPS (measured 2026-11-07: started 17.7 s, serving 19.7 s,
# renewal refused at 19.3 s). Wait for its health endpoint over verified TLS.
[Unit]
After=step-ca.service
Wants=step-ca.service

[Service]
ExecStartPre=/usr/bin/timeout 60 /bin/sh -c "until curl -sf --cacert /etc/step-ca/certs/root_ca.crt https://127.0.0.1:8443/health > /dev/null; do sleep 1; done"
