# Managed by Ansible (role telegraf).
# iot_sensors (topics sensors, status, ems) take the device time ts (Unix seconds) as the point time,
# when it is plausible: after 2023-11-14 and at most 5 min ahead of the Pi clock. Otherwise the arrival
# time stays (a device before NTP sends a ts near 0). Why (C4, 2026-11-22):
# - messages queued by the broker during a Telegraf restart are stored at the time they were measured;
# - a retained status message, sent again at every subscription, rewrites its own point instead of
#   adding a false one at each Telegraf reconnection (6 a day per device were measured);
# - readings that a device buffered offline and publishes later land at their own time.
# Cost: two messages of one device in the same second become one point (0.3 % of sensor messages).
# nilm_readings is left out: 5.7 % of its messages share their second.
[[processors.starlark]]
  namepass = ["iot_sensors"]
  source = '''
load("time.star", "time")

def apply(metric):
    ts = metric.fields.get("ts")
    if ts == None:
        return metric
    t = int(ts)
    if t > 1700000000 and t <= time.now().unix + 300:
        metric.time = t * 1000000000
    return metric
'''
