[[inputs.mqtt_consumer]]
  servers       = ["tcp://127.0.0.1:1883"]
  username      = "telegraf-bridge"
  password      = "${TELEGRAF_MQTT_PASSWORD}"
  qos           = 0
  topics        = ["iot/+/sensors","iot/+/status","iot/+/ems"]
  data_format   = "json"
  tag_keys      = ["device_id", "hw_model", "active_sensors"]
  name_override = "iot_sensors"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iot/+/+"
    tags  = "_/device_id/msg_type"

  # [[inputs.mqtt_consumer.json_v2]]
  #  timestamp_path    = "ts"
  #  timestamp_format  = "unix"

[[outputs.influxdb_v2]]
  urls         = ["http://127.0.0.1:8086"]
  token        = "${TELEGRAF_INFLUX_TOKEN}"
  organization = "iot-org"
  bucket       = "iot-hot"
  timeout      = "10s"
