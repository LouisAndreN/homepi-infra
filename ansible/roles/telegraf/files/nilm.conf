[[inputs.mqtt_consumer]]
  servers       = ["tcp://127.0.0.1:1883"]
  username      = "telegraf-bridge"
  password      = "${TELEGRAF_MQTT_PASSWORD}"
  # Persistent session (C4): Telegraf acknowledges a message only once InfluxDB took it, so messages in
  # flight when it stops are delivered again. The broker does NOT queue what is published while Telegraf
  # is away: mosquitto 2.0.18 with per_listener_settings true queues nothing for an offline durable
  # client (docs/runbooks/telegraf.md). That gap is a restart, about a second, on configuration changes.
  # The role's test run uses a copy with another client id and no session (never this session).
  client_id          = "telegraf-nilm"
  persistent_session = true
  qos                = 1
  # NILM keeps the arrival time: 5.7 % of its messages share their second (measured 2026-11-22), so the
  # second-resolution ts would overwrite points. Messages queued during a restart are stored late.
  topics        = ["iot/+/nilm"]
  data_format   = "json"
  tag_keys      = ["hw_model"]
  name_override = "nilm_readings"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iot/+/nilm"
    tags  = "_/device_id/_"
