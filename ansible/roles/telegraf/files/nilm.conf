[[inputs.mqtt_consumer]]
  servers       = ["tcp://127.0.0.1:1883"]
  username      = "telegraf-bridge"
  password      = "${TELEGRAF_MQTT_PASSWORD}"
  qos           = 0
  topics        = ["iot/+/nilm"]
  data_format   = "json"
  tag_keys      = ["hw_model"]
  name_override = "nilm_readings"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iot/+/nilm"
    tags  = "_/device_id/_"
