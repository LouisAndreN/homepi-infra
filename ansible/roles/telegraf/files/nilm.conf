[[inputs.mqtt_consumer]]
  servers       = ["tcp://127.0.0.1:1883"]
  username      = "telegraf-bridge"
  password      = "${TELEGRAF_MQTT_PASSWORD}"
  # Persistent session (C4): the broker queues QoS 1 messages while Telegraf restarts (about 1000 per
  # client, the Mosquitto default), and Telegraf acknowledges a message only once InfluxDB took it.
  # The role's test run sets TELEGRAF_MQTT_TEST: another client id and no session, so it never takes
  # over this session nor acknowledges (and drops) its queued messages.
  client_id          = "telegraf-nilm${TELEGRAF_MQTT_TEST:-}"
  persistent_session = ${TELEGRAF_MQTT_PERSISTENT:-true}
  qos                = 1
  # NILM keeps the arrival time: 5.7 % of its messages share their second (measured 2026-11-22), so the
  # second-resolution ts would overwrite points. Messages queued during a restart are stored late.
  topics        = ["iot/+/nilm"]
  data_format   = "json"
  tag_keys      = ["hw_model"]
  name_override = "nilm_readings"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iot/+/nilm"
    tags  = "_/device_id/_"
