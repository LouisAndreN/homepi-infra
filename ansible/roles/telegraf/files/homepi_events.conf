# Platform events -> InfluxDB iot-hot, measurement homepi_events (dashboard Energy > Timeline).
# Devices publish JSON on iot/<device_id>/event: {"kind": "teensy_update", "phase": "start"|"end"|"instant",
# "ref": "<id shared by start and end>", "detail": "...", "ok": 1}. kind is a tag (few values: teensy_update,
# ota, capture, appliance); phase, ref and detail are string fields (the json parser drops strings unless
# listed). Same session rules as homepi_mqtt.conf and nilm.conf (persistent session, qos 1, client id
# changed for the role's test run).
[[inputs.mqtt_consumer]]
  servers            = ["tcp://127.0.0.1:1883"]
  username           = "telegraf-bridge"
  password           = "${TELEGRAF_MQTT_PASSWORD}"
  client_id          = "telegraf-events"
  persistent_session = true
  qos                = 1
  topics             = ["iot/+/event"]
  data_format        = "json"
  tag_keys           = ["kind"]
  json_string_fields = ["phase", "ref", "detail"]
  name_override      = "homepi_events"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iot/+/event"
    tags  = "_/device_id/_"
