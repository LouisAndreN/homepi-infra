# Managed by Ansible (role telegraf). Weather at home observed by JMA AMeDAS -> iot-hot, measurements weather and
# weather_daily (docs/runbooks/weather.md). The script downloads national files only (the same for everyone)
# and picks the nearest stations on the Pi: the location, from SOPS through the environment file, is never
# sent. 15 min: JMA publishes an hour about 10 min after it ends; a state file keeps the hours already
# written, so a run usually fetches one file or none. The hourly Influx task copies both measurements to
# iot-archives (one year) for the Energy calendars.
[[inputs.exec]]
  commands    = ["/usr/local/sbin/homepi-weather"]
  interval    = "15m"
  timeout     = "90s"
  data_format = "influx"
