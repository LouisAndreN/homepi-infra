# Managed by Ansible (role telegraf). Weather at home -> iot-hot, measurements weather and weather_daily
# (docs/runbooks/weather.md). The script calls Open-Meteo over HTTPS; the location comes from SOPS through
# the environment file. 15 min: the hour that just started gets its value within the quarter, and a failed
# call (network, API) is simply retried by the next run. The hourly Influx task copies both measurements
# to iot-archives (one year) for the Energy calendars.
[[inputs.exec]]
  commands    = ["/usr/local/sbin/homepi-weather"]
  interval    = "15m"
  timeout     = "45s"
  data_format = "influx"
