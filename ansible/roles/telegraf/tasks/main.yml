# Telegraf: MQTT (telegraf-bridge, read only) -> InfluxDB iot-hot (telegraf-write).
# Secrets come from SOPS through an environment file only systemd reads. See docs/runbooks/telegraf.md.
- name: Mosquitto password tool
  ansible.builtin.copy:
    src: homepi-mqtt-passwd
    dest: "{{ telegraf_passwd_tool }}"
    owner: root
    group: root
    mode: "0755"
  register: telegraf_passwd_tool_task

- name: telegraf-bridge password in the broker password file matches SOPS
  ansible.builtin.command:
    argv: "{{ [telegraf_passwd_tool, telegraf_broker_passwd_file, 'telegraf-bridge'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ telegraf_mqtt_password }}"
    chdir: /
  register: telegraf_broker_password
  changed_when: telegraf_broker_password.stdout in ['changed', 'would change']
  check_mode: false
  no_log: true
  when: not (ansible_check_mode and telegraf_passwd_tool_task is changed)

- name: Mosquitto reloads the password file
  ansible.builtin.systemd:
    name: mosquitto
    state: reloaded
  when: telegraf_broker_password is changed

# The location goes into an environment file: a value that is not a plain number would be a way to inject
# another variable, so anything else stops the run here.
- name: Weather location from SOPS is two plain numbers
  ansible.builtin.assert:
    that:
      - telegraf_weather_lat | string is match('^-?[0-9]{1,2}([.][0-9]{1,6})?$')
      - telegraf_weather_lon | string is match('^-?[0-9]{1,3}([.][0-9]{1,6})?$')
    fail_msg: "weather_lat / weather_lon in ansible/secrets/weather.sops.yaml must be decimal degrees (docs/runbooks/weather.md)"
    quiet: true
  no_log: true

- name: Telegraf secrets (environment file read by systemd only)
  ansible.builtin.copy:
    content: |
      TELEGRAF_MQTT_PASSWORD={{ telegraf_mqtt_password }}
      TELEGRAF_INFLUX_TOKEN={{ telegraf_influx_token }}
      HOMEPI_WEATHER_LAT={{ telegraf_weather_lat }}
      HOMEPI_WEATHER_LON={{ telegraf_weather_lon }}
    dest: /var/lib/secrets/telegraf.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: telegraf_env

- name: Telegraf loads its secrets
  ansible.builtin.copy:
    src: telegraf-secrets.conf
    dest: /etc/systemd/system/telegraf.service.d/secrets.conf
    owner: root
    group: root
    mode: "0644"
  register: telegraf_dropin

- name: Telegraf no longer loads api.env (it carried the homepi-api MQTT password)
  ansible.builtin.file:
    path: /etc/systemd/system/telegraf.service.d/homepi.conf
    state: absent
  register: telegraf_legacy_dropin

# NILM calibration (firmware v3): the processor is code (root, GitOps), the calibration file is state
# (written by the admin API as homepi-api, read by Telegraf through the group, backed up nightly with
# /var/lib/homepi). setgid keeps the group telegraf on the files the API creates. Content never managed here.
- name: NILM calibration processor
  ansible.builtin.copy:
    src: homepi-nilm-calibrate
    dest: /usr/local/sbin/homepi-nilm-calibrate
    owner: root
    group: root
    mode: "0755"
  register: telegraf_nilm_processor

- name: Weather collector (run by Telegraf inputs.exec)
  ansible.builtin.copy:
    src: homepi-weather
    dest: /usr/local/sbin/homepi-weather
    owner: root
    group: root
    mode: "0755"
  register: telegraf_weather_tool

- name: NILM calibration state directory (API writes, Telegraf reads)
  ansible.builtin.file:
    path: /var/lib/homepi/nilm
    state: directory
    owner: homepi-api
    group: telegraf
    mode: "2750"

- name: Telegraf inputs and output
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/telegraf/telegraf.d/{{ item }}"
    owner: root
    group: telegraf
    mode: "0640"
  loop: [homepi_mqtt.conf, nilm.conf, homepi_events.conf, homepi_time.conf, weather.conf]
  register: telegraf_confs

# A restart decided only from "changed in this run" is lost when the run fails after the copy: the next run
# sees identical files, skips the test and the restart, and reports success while Telegraf keeps the old
# configuration (v1.2.0, 2026-11-27: Telegraf ran its configuration of the day before). The running process
# is compared with the files instead: any of them newer than the process start means a restart is due.
- name: Telegraf runs the current configuration? (files newer than the running process)
  ansible.builtin.shell: |
    set -u
    # Start time without parsing a localised date: boot time + monotonic start (0 when not running)
    mono=$(systemctl show telegraf -p ActiveEnterTimestampMonotonic --value)
    btime=$(awk '/^btime/ {print $2}' /proc/stat)
    start_s=$(( ${mono:-0} > 0 ? btime + mono / 1000000 : 0 ))
    newest=$(stat -c %Y /etc/telegraf/telegraf.conf /etc/telegraf/telegraf.d/*.conf /usr/local/sbin/homepi-nilm-calibrate /usr/local/sbin/homepi-weather \
      /var/lib/secrets/telegraf.env /etc/systemd/system/telegraf.service.d/*.conf 2>/dev/null | sort -n | tail -1)
    if [ "${newest:-0}" -gt "$start_s" ]; then echo stale; else echo current; fi
  args:
    executable: /bin/bash
    chdir: /
  register: telegraf_running_config
  changed_when: false
  check_mode: false

- name: api.env no longer holds Telegraf credentials
  ansible.builtin.lineinfile:
    path: /etc/homepi/api.env
    regexp: "^{{ item }}="
    state: absent
  loop: [MOSQUITTO_TELEGRAF_PASS, INFLUX_TOKEN]
  no_log: true
  diff: false

# The test runs on a copy with another client id and no session: with the production client id it would
# take over the session of the running Telegraf and acknowledge (drop) its queued messages (C4).
# Environment variables cannot do this: Telegraf 1.38+ substitutes them inside strings only.
- name: New configuration authenticates to the broker (test run on a copy, nothing written)
  ansible.builtin.shell: |
    set -eu
    d=$(mktemp -d /run/telegraf-test.XXXXXX)
    trap 'rm -rf "$d"' EXIT
    cp /etc/telegraf/telegraf.d/*.conf "$d/"
    sed -i -E 's/^(\s*client_id\s*=\s*"[^"]*)"/\1-test"/; s/^(\s*persistent_session\s*=\s*)true/\1false/' "$d"/*.conf
    chgrp -R telegraf "$d"; chmod 0750 "$d"; chmod 0640 "$d"/*.conf
    systemd-run --quiet --wait --pipe --collect -p User=telegraf -p EnvironmentFile=/var/lib/secrets/telegraf.env \
      /usr/bin/telegraf --config /etc/telegraf/telegraf.conf --config-directory "$d" \
      --test --test-wait 10 --input-filter mqtt_consumer
  args:
    executable: /bin/bash
    chdir: /
  register: telegraf_test
  changed_when: false
  failed_when: telegraf_test.rc != 0 or 'E!' in (telegraf_test.stdout + telegraf_test.stderr)
  when:
    - not ansible_check_mode
    - telegraf_broker_password is changed or telegraf_env is changed or telegraf_dropin is changed or telegraf_legacy_dropin is changed or telegraf_confs is changed or telegraf_nilm_processor is changed or telegraf_weather_tool is changed or telegraf_running_config.stdout == 'stale'

- name: Telegraf restarted on the new configuration
  ansible.builtin.systemd:
    name: telegraf
    state: restarted
    daemon_reload: true
  when: telegraf_broker_password is changed or telegraf_env is changed or telegraf_dropin is changed or telegraf_legacy_dropin is changed or telegraf_confs is changed or telegraf_nilm_processor is changed or telegraf_weather_tool is changed or telegraf_running_config.stdout == 'stale'

- name: Telegraf enabled and running
  ansible.builtin.systemd:
    name: telegraf
    enabled: true
    state: started
