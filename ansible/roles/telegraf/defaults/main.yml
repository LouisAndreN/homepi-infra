telegraf_mqtt_password: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/pki.sops.yaml', extract='[\"mqtt_telegraf_password\"]') }}"
telegraf_influx_token: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/influx.sops.yaml', extract='[\"influx_telegraf_token\"]') }}"
telegraf_passwd_tool: /usr/local/sbin/homepi-mqtt-passwd
telegraf_broker_passwd_file: /etc/mosquitto/passwd/telegraf.passwd
# Home location for the weather collector: SOPS only, used on the Pi to pick the nearest AMeDAS stations, never sent (docs/runbooks/weather.md)
telegraf_weather_lat: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/weather.sops.yaml', extract='[\"weather_lat\"]') }}"
telegraf_weather_lon: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/weather.sops.yaml', extract='[\"weather_lon\"]') }}"
