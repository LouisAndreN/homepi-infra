# InfluxDB: configuration, unit, and the state inside InfluxDB (buckets, tasks, authorizations)
# checked against the repository. See docs/runbooks/influxdb.md.
- name: InfluxDB configuration
  ansible.builtin.copy:
    src: config.toml
    dest: /etc/influxdb/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart influxdb

- name: InfluxDB unit
  ansible.builtin.copy:
    src: influxdb.service
    dest: /etc/systemd/system/influxdb.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart influxdb

- name: InfluxDB enabled and running
  ansible.builtin.systemd:
    name: influxdb
    enabled: true
    state: started

- name: InfluxDB state checker
  ansible.builtin.copy:
    src: homepi-influx-check
    dest: "{{ influxdb_check }}"
    owner: root
    group: root
    mode: "0755"
  register: influxdb_checker

- name: InfluxDB state matches the repository (buckets, tasks, authorizations)
  ansible.builtin.command:
    argv: ["{{ influxdb_check }}"]
    stdin: "{{ influxdb_expected | to_json }}"
    chdir: /
  environment:
    INFLUX_TOKEN: "{{ influxdb_admin_token }}"
  register: influxdb_state
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and influxdb_checker is changed)
