---
# Alloy: log collection to Loki. The label rules are documented at the top of files/config.alloy.
- name: Install the Alloy configuration (rejected by alloy validate if it is broken)
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/alloy validate %s
  register: alloy_config

# alloy validate parses the file but does not build the components: a bad stage selector passed it and
# stopped every log in v0.1.109. So restart, check that Alloy is still up 20 s later, and on failure
# restore the previous file, restart on it and fail the run.
- name: Restart Alloy on a new configuration, back to the previous one if it does not stay up
  when: alloy_config is changed and not ansible_check_mode
  block:
    - name: Restart Alloy when its configuration changed
      ansible.builtin.systemd:
        name: alloy
        state: restarted

    - name: Give Alloy time to build its components (failures exit within a few seconds)
      ansible.builtin.pause:
        seconds: 20

    - name: Alloy is still active
      ansible.builtin.command: systemctl is-active alloy
      changed_when: false
  rescue:
    - name: Restore the previous Alloy configuration
      ansible.builtin.copy:
        src: "{{ alloy_config.backup_file }}"
        dest: /etc/alloy/config.alloy
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: alloy_config.backup_file is defined

    - name: Restart Alloy on the previous configuration
      ansible.builtin.systemd:
        name: alloy
        state: restarted

    - name: Stop the run
      ansible.builtin.fail:
        msg: >-
          Alloy did not stay up on the new configuration; the previous file is restored and Alloy
          restarted on it. Read: journalctl -u alloy --since -10min

- name: Keep Alloy enabled and running
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started

# GeoIP removed in v0.1.109 (no public source reaches the Pi behind NAT): remove what v0.1.108 installed.
# Runs after the restart, so Alloy no longer reads the databases.
- name: GeoIP account file and databases are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/GeoIP.conf
    - /var/lib/GeoIP

# Exec audit trail (C3, 2026-11-21): auditd rule key "exec" -> this correlator -> exec-events.jsonl ->
# Alloy job auditd_exec -> Loki. On production it was installed by hand; R3 does not restore its unit,
# so a rebuilt Pi lost the trail silently (only homepi-alloy-check noticed). The script and the
# logrotate file are the production bytes; the unit differs only by its English Description. The
# script creates /var/log/homepi itself.
- name: Exec audit correlator script (production bytes)
  ansible.builtin.copy:
    src: audit_exec_correlator.py
    dest: /opt/homepi/audit_exec_correlator.py
    owner: root
    group: root
    mode: "0750"
  register: alloy_correlator_script

- name: Exec audit correlator unit
  ansible.builtin.copy:
    src: audit-exec-correlator.service
    dest: /etc/systemd/system/audit-exec-correlator.service
    owner: root
    group: root
    mode: "0644"
  register: alloy_correlator_unit

- name: Exec events log rotation (production bytes)
  ansible.builtin.copy:
    src: logrotate-homepi-exec-events
    dest: /etc/logrotate.d/homepi-exec-events
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd after a correlator unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: alloy_correlator_unit is changed and not ansible_check_mode

- name: Exec audit correlator enabled and running
  ansible.builtin.systemd:
    name: audit-exec-correlator
    enabled: true
    state: started
  register: alloy_correlator_started

# A new script needs a restart; a new Description does not, but daemon-reload already covers it
- name: Restart the correlator on a new script
  ansible.builtin.systemd:
    name: audit-exec-correlator
    state: restarted
  when: alloy_correlator_script is changed and alloy_correlator_started is not changed and not ansible_check_mode
