---
# Dashboard: built from the deployed tag by an unprivileged user (npm ci --ignore-scripts: lockfile
# integrity, no install scripts), checked (assets present, no token), installed as a root-owned release
# directory and switched atomically through a symlink. The stamp (content hash of apps/dashboard)
# detects drift in check mode. Any failure points the symlink back to the previous release.

- name: Content hash of apps/dashboard in the deployed tag
  ansible.builtin.command:
    argv: [python3, -I, "{{ role_path }}/files/source-hash.py", "{{ dashboard_src }}"]
  check_mode: false
  changed_when: false
  register: dashboard_tree

# A rebuilt Pi has no served dashboard: R3 does not restore /var/www, the build regenerates it
# (C3, 2026-11-21). The probe below cannot run without the directory, so a missing one means build.
- name: Served dashboard present? (read-only)
  ansible.builtin.stat:
    path: "{{ dashboard_current }}"
  register: dashboard_served

- name: Served dashboard is the deployed source? (check mode only)
  ansible.builtin.copy:
    content: "{{ dashboard_tree.stdout }}\n"
    dest: "{{ dashboard_current }}/{{ dashboard_stamp }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: dashboard_probe
  when: dashboard_served.stat.exists

- name: Unprivileged build user
  ansible.builtin.user:
    name: "{{ dashboard_build_user }}"
    system: true
    home: "{{ dashboard_build_home }}"
    create_home: true
    shell: /usr/sbin/nologin

- name: Build, check and switch the dashboard, rolling back on any failure
  when: (not dashboard_served.stat.exists) or dashboard_probe is changed
  vars:
    dashboard_build: "{{ dashboard_build_home }}/build-{{ dashboard_tree.stdout[:12] }}"
    dashboard_release: "{{ dashboard_releases }}/{{ dashboard_tree.stdout[:12] }}"
  block:
    - name: Served path before the change
      ansible.builtin.stat:
        path: "{{ dashboard_current }}"
      register: dashboard_before

    - name: Previous release (rollback target)
      ansible.builtin.set_fact:
        dashboard_previous: >-
          {{ dashboard_before.stat.lnk_source if (dashboard_before.stat.islnk | default(false))
             else dashboard_legacy }}

    - name: Clean build directory
      ansible.builtin.file:
        path: "{{ dashboard_build }}"
        state: absent

    - name: Build directory owned by the build user
      ansible.builtin.file:
        path: "{{ dashboard_build }}"
        state: directory
        owner: "{{ dashboard_build_user }}"
        group: "{{ dashboard_build_user }}"
        mode: "0755"

    - name: Sources of the deployed tag
      ansible.builtin.copy:
        src: "{{ dashboard_src }}/"
        dest: "{{ dashboard_build }}/"
        owner: "{{ dashboard_build_user }}"
        group: "{{ dashboard_build_user }}"
        mode: u=rwX,go=rX  # X: execute on directories only (a numeric mode also hits the top directory)

    - name: Locked dependencies (integrity checked, no install scripts)
      ansible.builtin.command:
        argv: [runuser, -u, "{{ dashboard_build_user }}", --, env, "HOME={{ dashboard_build_home }}", npm, ci, --ignore-scripts, --no-audit, --no-fund]
        chdir: "{{ dashboard_build }}"
      when: not ansible_check_mode  # chdir is checked before check mode skips the task

    - name: Build
      ansible.builtin.command:
        argv: [runuser, -u, "{{ dashboard_build_user }}", --, sh, -c, 'umask 022 && exec env HOME="$0" npm run build', "{{ dashboard_build_home }}"]
        chdir: "{{ dashboard_build }}"
      when: not ansible_check_mode

    - name: Build references only existing assets and carries no token
      ansible.builtin.command:
        argv: [python3, -I, "{{ role_path }}/files/check-dashboard-build.py", "{{ dashboard_build }}/dist"]
      changed_when: false
      when: not ansible_check_mode

    - name: Releases directory
      ansible.builtin.file:
        path: "{{ dashboard_releases }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Root-owned release directory
      ansible.builtin.copy:
        src: "{{ dashboard_build }}/dist/"
        dest: "{{ dashboard_release }}/"
        remote_src: true
        owner: root
        group: root
        mode: u=rwX,go=rX  # X: execute on directories only (a numeric mode also hits the top directory)
      when: not ansible_check_mode

    - name: Release readable at every level (copy keeps the build modes below the top directory)
      ansible.builtin.file:
        path: "{{ dashboard_release }}"
        recurse: true
        mode: u=rwX,go=rX
      when: not ansible_check_mode

    - name: Release stamp
      ansible.builtin.copy:
        content: "{{ dashboard_tree.stdout }}\n"
        dest: "{{ dashboard_release }}/{{ dashboard_stamp }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode

    - name: Keep the hand-deployed directory as the first rollback target
      ansible.builtin.command:
        argv: [mv, -T, "{{ dashboard_current }}", "{{ dashboard_legacy }}"]
      when: not ansible_check_mode and dashboard_before.stat.exists and dashboard_before.stat.isdir and not (dashboard_before.stat.islnk | default(false))

    - name: Switch the served release atomically
      ansible.builtin.shell: >-
        ln -sfn {{ dashboard_release | quote }} {{ (dashboard_current ~ '.new') | quote }}
        && mv -T {{ (dashboard_current ~ '.new') | quote }} {{ dashboard_current | quote }}
      when: not ansible_check_mode

    - name: Dashboard answers through nginx
      ansible.builtin.command:
        argv: [curl, -sk, -o, /dev/null, -w, "%{http_code}", --max-time, "5", --resolve, "homepi.internal:443:127.0.0.1", "https://homepi.internal{{ item.path }}"]
      loop: "{{ dashboard_health_checks }}"
      loop_control:
        label: "{{ item.path }} -> {{ item.status }}"
      register: dashboard_health
      changed_when: false
      retries: 5
      delay: 2
      until: dashboard_health.stdout == item.status
      when: not ansible_check_mode

    - name: Every served file is readable by nginx (www-data), in apply and check
      ansible.builtin.command:
        argv: [runuser, -u, www-data, --, find, -L, "{{ dashboard_current }}/", "(", "!", -readable, -o, -type, d, "!", -executable, ")", -print]
        chdir: /  # www-data cannot enter the Ansible working directory
      register: dashboard_unreadable
      changed_when: false
      check_mode: false
      failed_when: dashboard_unreadable.rc != 0 or (dashboard_unreadable.stdout | length) > 0

    - name: Remove the build directory (the npm cache stays in the build user's home)
      ansible.builtin.file:
        path: "{{ dashboard_build }}"
        state: absent

  rescue:
    - name: Served path at the failure
      ansible.builtin.stat:
        path: "{{ dashboard_current }}"
      register: dashboard_at_failure

    # On a rebuilt Pi there is no previous release: no link is made to a directory that does not exist
    - name: Previous release exists?
      ansible.builtin.stat:
        path: "{{ dashboard_previous | default('/nonexistent') }}"
      register: dashboard_previous_target

    - name: Point the dashboard back to the previous release
      ansible.builtin.shell: >-
        ln -sfn {{ dashboard_previous | quote }} {{ (dashboard_current ~ '.new') | quote }}
        && mv -T {{ (dashboard_current ~ '.new') | quote }} {{ dashboard_current | quote }}
      when: >-
        not ansible_check_mode and dashboard_previous is defined and dashboard_previous_target.stat.exists
        and ((dashboard_at_failure.stat.islnk | default(false)) or not dashboard_at_failure.stat.exists)
      register: dashboard_rollback

    - name: Report the rollback
      ansible.builtin.fail:
        msg: >-
          dashboard deployment failed{{ ' (check mode: nothing changed)' if ansible_check_mode else (' and was rolled back to ' ~ dashboard_previous if (dashboard_rollback is defined and dashboard_rollback is not skipped) else ' before the switch (nothing was changed)') }}:
          {{ ansible_failed_result.msg | default('see the failed task above') }}

- name: Served dashboard readable by nginx (www-data), on every apply and check
  ansible.builtin.command:
    argv: [runuser, -u, www-data, --, find, -L, "{{ dashboard_current }}/", "(", "!", -readable, -o, -type, d, "!", -executable, ")", -print]
    chdir: /  # www-data cannot enter the Ansible working directory
  register: dashboard_served_unreadable
  changed_when: false
  check_mode: false
  failed_when: dashboard_served_unreadable.rc != 0 or (dashboard_served_unreadable.stdout | length) > 0
