per_listener_settings true

# ════════════════════════════════════════════════════════════
# Port 8883 — mTLS strict — Devices IoT (ESP32)
# ════════════════════════════════════════════════════════════
listener 8883 192.168.200.1

certfile /etc/mosquitto/certs/broker_chain.crt
keyfile  /etc/mosquitto/certs/broker.key
cafile   /etc/mosquitto/certs/ca_chain.crt

require_certificate      true
use_identity_as_username true
tls_version              tlsv1.2
# crlfile                  /etc/mosquitto/crl/crl.pem
acl_file                 /etc/mosquitto/acl/devices.acl
allow_anonymous          false
max_keepalive            120
max_inflight_messages    100
persistent_client_expiration 7d

# ════════════════════════════════════════════════════════════
# Port 1883 — loopback — Telegraf bridge uniquement
# ════════════════════════════════════════════════════════════
listener 1883 127.0.0.1

allow_anonymous false
password_file   /etc/mosquitto/passwd/telegraf.passwd
acl_file        /etc/mosquitto/acl/devices.acl
