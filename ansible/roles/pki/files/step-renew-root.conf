[Service]
# Reset the original command, then pin the root CA explicitly (no dependency on /root/.step)
ExecStart=
ExecStart=/usr/bin/step ca renew --ca-url https://127.0.0.1:8443 --root /etc/step-ca/certs/root_ca.crt --force /etc/nginx/ssl/wildcard.homepi.fullchain.pem /etc/nginx/ssl/wildcard.homepi.key
