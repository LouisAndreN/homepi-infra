# HomePi — Mosquitto config principale
pid_file /run/mosquitto/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type information
# v0.1.121: connections and disconnections with client id and IP (notice). On 2026-11-15 a rollout
# could not tell whether esp32-819fe250 had dropped its session: the log had no connection lines.
log_type notice
log_timestamp true
include_dir /etc/mosquitto/conf.d
