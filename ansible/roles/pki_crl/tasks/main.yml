---
# B3.2a: keep the CRL fresh for the broker, re-signed without the IDP extension (v0.1.116).
# The broker does not read it yet: B3.2b adds crlfile once the re-signed CRL is proven on the Pi.

- name: python3-cryptography for homepi-crl-resign
  ansible.builtin.apt:
    name: python3-cryptography
    state: present

- name: CRL sync scripts (homepi-crl-resign drops the IDP step-ca adds, v0.1.116)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [homepi-crl-sync, homepi-crl-resign]
  register: pki_crl_script

- name: CRL sync service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [homepi-crl-sync.service, homepi-crl-sync.timer]
  register: pki_crl_units

- name: Reload systemd after a CRL unit change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: pki_crl_units is changed

- name: The old CRL cron job is gone (it failed from 2026-05-23 to 2026-11-08)
  ansible.builtin.file:
    path: /etc/cron.d/homepi-crl
    state: absent

# Check mode does not install a new unit: skip only when the unit is about to be created, never ignore errors
- name: CRL sync timer enabled and running
  ansible.builtin.systemd_service:
    name: homepi-crl-sync.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and pki_crl_units is changed)

- name: Sync the CRL now when the script or units changed (fails the run if the sync fails)
  ansible.builtin.systemd_service:
    name: homepi-crl-sync.service
    state: started
  when:
    - not (ansible_check_mode and pki_crl_units is changed)
    - pki_crl_script is changed or pki_crl_units is changed
