  - /etc/nginx/ssl/homepi.key
  - /etc/step-ca/secrets/root_ca_key
  - /etc/mosquitto/acl/revoked.acl
  - /etc/authelia/secrets.txt
  - /etc/authelia/docker-compose.yml
  - /etc/authelia/config
  - /etc/authelia/configuration.yml.dpkg-old
  - /var/lib/authelia/db.sqlite3.bak
  - /etc/telegraf/telegraf.conf.disabled
  - /etc/influxdb/tasks
  - /root/.influxdbv2
  - /etc/homepi/master.key
  - /etc/homepi/step-ca
  - /etc/nginx/sites-available/homepi.internal.bak-20261023
  - /etc/nginx/sites-available/edge-iot.OBSOLETE_never_enabled
