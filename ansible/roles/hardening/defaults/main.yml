  - {path: /opt/homepi/scripts, owner: root, group: root, mode: "0755"}
# Trees run or served by root: no file may belong to another account
hardening_root_trees:
  - /opt/pironman5
  - /opt/homepi/scripts
  - /opt/homepi/api
  - /opt/homepi/api-venv
  - /var/www/homepi-dashboard-releases
