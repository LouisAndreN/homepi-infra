---
- name: Create the AWS edge directory (certificate, key, config; root only)
  ansible.builtin.file:
    path: "{{ aws_edge_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the versioned directory of the credential helper
  ansible.builtin.file:
    path: "{{ aws_edge_helper_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: aws_edge_helper_dir_task

- name: Install the pinned IAM Roles Anywhere credential helper (checksum verified)
  ansible.builtin.get_url:
    url: "{{ gitops_tools.aws_signing_helper.url }}"
    dest: "{{ aws_edge_helper_dir }}/aws_signing_helper"
    checksum: "sha256:{{ gitops_tools.aws_signing_helper.sha256 }}"
    owner: root
    group: root
    mode: "0755"
  # In check mode a directory created by this same run does not exist yet
  when: not (ansible_check_mode and aws_edge_helper_dir_task is changed)

- name: Point /usr/local/bin/aws_signing_helper at the pinned version
  ansible.builtin.file:
    src: "{{ aws_edge_helper_dir }}/aws_signing_helper"
    dest: /usr/local/bin/aws_signing_helper
    state: link
    # In check mode the binary is not downloaded yet, so the link target may not exist
    force: "{{ ansible_check_mode }}"

- name: Install the aws-edge provisioner password and the AWS config
  vars:
    aws_edge_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/aws.sops.yaml') | from_yaml }}"
  no_log: true
  block:
    - name: Install the step-ca provisioner password (decrypted on the controller)
      ansible.builtin.copy:
        content: "{{ aws_edge_secrets.aws_edge_provisioner_password }}"
        dest: "{{ aws_edge_dir }}/provisioner_password"
        owner: root
        group: root
        mode: "0600"

    - name: Install the AWS config with the Roles Anywhere credential process
      ansible.builtin.template:
        src: aws-config.j2
        dest: "{{ aws_edge_dir }}/config"
        owner: root
        group: root
        mode: "0600"

- name: Install the certificate renewal script
  ansible.builtin.copy:
    src: homepi-aws-edge-renew
    dest: /usr/local/sbin/homepi-aws-edge-renew
    owner: root
    group: root
    mode: "0750"

- name: Install the renewal unit and timer
  ansible.builtin.copy:
    src: "systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [homepi-aws-edge-renew.service, homepi-aws-edge-renew.timer]
  register: aws_edge_units

- name: Reload systemd when a unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: aws_edge_units is changed

- name: Enable and start the renewal timer
  ansible.builtin.systemd_service:
    name: homepi-aws-edge-renew.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and aws_edge_units is changed)

# On a new Pi this issues the first certificate; on this one it only writes the first metric
- name: Run the renewal once when its metric does not exist yet
  ansible.builtin.command:
    cmd: /usr/local/sbin/homepi-aws-edge-renew
    creates: "{{ aws_edge_metrics }}"
  when: not ansible_check_mode

- name: Create the virtualenv with the pinned boto3 (off-site uploads)
  ansible.builtin.pip:
    name: "boto3=={{ gitops_tools.boto3_version }}"
    virtualenv: /opt/homepi-aws/venv
    virtualenv_command: python3 -m venv

- name: Install the name of the off-site bucket (derived from the role ARN, holds the account ID)
  vars:
    aws_edge_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/aws.sops.yaml') | from_yaml }}"
  no_log: true
  ansible.builtin.copy:
    content: "homepi-backups-{{ aws_edge_secrets.aws_edge_role_arn.split(':')[4] }}\n"
    dest: "{{ aws_edge_dir }}/bucket"
    owner: root
    group: root
    mode: "0600"

- name: Install the off-site upload script
  ansible.builtin.copy:
    src: homepi-offsite-upload
    dest: /usr/local/sbin/homepi-offsite-upload
    owner: root
    group: root
    mode: "0750"

- name: Install the off-site scheduler (newest verified archive of each kind, uploaded once)
  ansible.builtin.copy:
    src: homepi-offsite-run
    dest: /usr/local/sbin/homepi-offsite-run
    owner: root
    group: root
    mode: "0750"

- name: Install the off-site units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homepi-offsite.service
    - homepi-offsite.timer
  register: aws_edge_offsite_units

# In check mode the units do not exist yet when they are new, so systemd cannot enable them
- name: Enable the hourly off-site timer
  ansible.builtin.systemd:
    name: homepi-offsite.timer
    enabled: true
    state: started
    daemon_reload: "{{ aws_edge_offsite_units is changed }}"
  when: not (ansible_check_mode and aws_edge_offsite_units is changed)

# A running timer keeps the next elapse it computed from the old schedule: restart it on a change
- name: Off-site timer restarted on a new schedule
  ansible.builtin.systemd:
    name: homepi-offsite.timer
    state: restarted
  when: aws_edge_offsite_units is changed and not ansible_check_mode

# Security logs off the host (roadmap D2c): every 5 minutes into log-archive, write-only role
- name: Install the name of the Pi logs bucket (holds the log-archive account ID)
  vars:
    aws_edge_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/aws.sops.yaml') | from_yaml }}"
  no_log: true
  ansible.builtin.copy:
    content: "homepi-pi-logs-{{ aws_edge_secrets.log_archive_account_id }}\n"
    dest: "{{ aws_edge_dir }}/logs-bucket"
    owner: root
    group: root
    mode: "0600"

- name: Create the log shipping state directory (journal cursor)
  ansible.builtin.file:
    path: /var/lib/homepi-log-ship
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the log shipping script
  ansible.builtin.copy:
    src: homepi-log-ship
    dest: /usr/local/sbin/homepi-log-ship
    owner: root
    group: root
    mode: "0750"

- name: Install the log shipping units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homepi-log-ship.service
    - homepi-log-ship.timer
  register: aws_edge_logship_units

- name: Enable the log shipping timer
  ansible.builtin.systemd:
    name: homepi-log-ship.timer
    enabled: true
    state: started
    daemon_reload: "{{ aws_edge_logship_units is changed }}"
  when: not (ansible_check_mode and aws_edge_logship_units is changed)

- name: Install the dead man's switch relay
  ansible.builtin.copy:
    src: homepi-heartbeat-relay
    dest: /usr/local/sbin/homepi-heartbeat-relay
    owner: root
    group: root
    mode: "0750"
  register: aws_edge_relay_script

- name: Install the relay unit
  ansible.builtin.copy:
    src: homepi-heartbeat-relay.service
    dest: /etc/systemd/system/homepi-heartbeat-relay.service
    owner: root
    group: root
    mode: "0644"
  register: aws_edge_relay_unit

# In check mode a new unit does not exist yet, so systemd cannot start it
- name: Run the relay (restarted when its code or unit changed)
  ansible.builtin.systemd:
    name: homepi-heartbeat-relay.service
    enabled: true
    state: "{{ 'restarted' if (aws_edge_relay_script is changed or aws_edge_relay_unit is changed) else 'started' }}"
    daemon_reload: "{{ aws_edge_relay_unit is changed }}"
  when: not (ansible_check_mode and aws_edge_relay_unit is changed)
