---
- name: Install the reconciler units and timers
  ansible.builtin.copy:
    src: "systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homepi-gitops@.service
    - homepi-gitops-apply.timer
    - homepi-gitops-check.timer
  register: gitops_units

- name: Reload systemd when a unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: gitops_units is changed

- name: Switch the timers on or off
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: "{{ gitops_timers_enabled }}"
    state: "{{ 'started' if gitops_timers_enabled else 'stopped' }}"
  loop: [homepi-gitops-apply.timer, homepi-gitops-check.timer]
  when: not (ansible_check_mode and gitops_units is changed)
