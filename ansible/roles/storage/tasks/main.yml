---
# Storage layout (B1). Boot-critical: fstab lines, subvolume mount units, Loki mount ordering.
# Volumes are never created or resized here: LVM changes are manual, documented operations.

- name: Btrfs root subvolume mount (/mnt/data, @iot-hot)
  ansible.posix.mount:
    path: /mnt/data
    src: /dev/vg-main/lv-data
    fstype: btrfs
    opts: defaults,noatime,compress=zstd:3,space_cache=v2,subvol=@iot-hot
    dump: "0"
    passno: "2"
    state: mounted
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_mount_data

- name: Loki volume mount (/var/lib/loki, XFS)
  ansible.posix.mount:
    path: /var/lib/loki
    src: /dev/vg-main/lv-loki
    fstype: xfs
    opts: defaults,noatime,inode64
    dump: "0"
    passno: "2"
    state: mounted
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_mount_loki

- name: Loki volume root ownership
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    group: loki
    mode: "0755"
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_loki_dir

- name: Btrfs subvolume mount units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ storage_subvolume_units }}"
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_units

- name: Loki drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/loki.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_loki_dropin_dir

- name: Loki must not start without its volume
  ansible.builtin.copy:
    src: loki-requires-mount.conf
    dest: /etc/systemd/system/loki.service.d/10-requires-mount.conf
    owner: root
    group: root
    mode: "0644"
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_loki_dropin

- name: Reload systemd after a unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (storage_verify_only | bool)
    - storage_units is changed or storage_loki_dropin is changed

- name: Subvolume mount units enabled and mounted
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ storage_subvolume_units }}"
  check_mode: "{{ storage_verify_only | bool }}"
  register: storage_units_state

- name: Fail on storage drift (GitOps verify mode)
  ansible.builtin.fail:
    msg: >-
      Storage drift detected. Boot-critical files are applied by hand:
      ansible-playbook storage.yml --check --diff, then the same without --check.
  when:
    - not (storage_apply | bool)
    - >-
      storage_mount_data is changed or storage_mount_loki is changed or storage_loki_dir is changed
      or storage_units is changed or storage_loki_dropin_dir is changed or storage_loki_dropin is changed
      or storage_units_state is changed
