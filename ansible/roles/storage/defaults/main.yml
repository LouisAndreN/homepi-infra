---
# false in site.yml (GitOps): verify only, the play fails on drift.
# true only in storage.yml, run by a human (fstab and *.mount are MANUAL, see homepi-triage).
storage_apply: false
# A --check run must never execute for real, whatever storage_apply says
storage_verify_only: "{{ ansible_check_mode or not (storage_apply | bool) }}"
# fstab: compared field by field with findmnt (whitespace does not matter);
# 'line' is written only when the entry is missing or different (rebuild).
storage_mounts:
  - target: /mnt/data
    fstab: "/dev/vg-main/lv-data btrfs defaults,noatime,compress=zstd:3,space_cache=v2,subvol=@iot-hot 0 2"
    mounted: "/dev/mapper/vg--main-lv--data[/@iot-hot] btrfs"
    line: "/dev/vg-main/lv-data       /mnt/data              btrfs   defaults,noatime,compress=zstd:3,space_cache=v2,subvol=@iot-hot  0 2"
  # nofail: a missing Loki volume must not block a headless boot; RequiresMountsFor keeps Loki stopped
  - target: /var/lib/loki
    fstab: "/dev/vg-main/lv-loki xfs defaults,noatime,inode64,nofail 0 2"
    mounted: "/dev/mapper/vg--main-lv--loki xfs"
    line: "/dev/vg-main/lv-loki       /var/lib/loki          xfs     defaults,noatime,inode64,nofail   0 2"
storage_subvolume_units:
  - mnt-data-backups.mount
  - mnt-data-personal.mount
  - mnt-data-archives.mount
