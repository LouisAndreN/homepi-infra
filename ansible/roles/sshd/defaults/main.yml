sshd_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEfs+vsI5FOUh6xZU7aGHrDAmjhz4SpM8Sr8H4BlePiJ louis@DESKTOP-581OMPC"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMk13Y1J6KfgthTMadIg1iSwl+a1GIYGe6VPjCeYxIFQ termux"
