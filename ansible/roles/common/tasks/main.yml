---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Read the current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_timezone
  changed_when: false
  check_mode: false

- name: Set the timezone
  ansible.builtin.command: "timedatectl set-timezone {{ common_timezone }}"
  when: common_current_timezone.stdout != common_timezone

- name: Create the persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Apply journald changes

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald (persistent storage, bounded size and age)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/homepi.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ common_journal_max_use }}
      MaxRetentionSec={{ common_journal_retention }}
  notify: Apply journald changes
