---
- name: Install the Prometheus configuration
  ansible.builtin.copy:
    src: prometheus/prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  notify: Reload prometheus

- name: Install the Prometheus alert rules (each file is validated before it replaces the live one)
  ansible.builtin.copy:
    src: "prometheus/rules/{{ item }}"
    dest: "/etc/prometheus/rules/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  loop: [alerts.yml, gitops.yml, backups.yml, aws_edge.yml, meta.yml, capacity.yml, offsite.yml, heartbeat.yml, gitops_github.yml, clock.yml, prometheus_self.yml, boot_chain.yml, pki.yml]
  notify: Reload prometheus

- name: Validate the Prometheus configuration and rules
  ansible.builtin.command: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
  changed_when: false
  check_mode: false

- name: Install the Loki configuration (validated before it replaces the file)
  ansible.builtin.copy:
    src: loki/loki.yml
    dest: /etc/loki/loki.yml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/loki -verify-config -config.file=%s
  notify: Restart loki

- name: Install the Alertmanager template (rendered by envsubst at each start)
  ansible.builtin.copy:
    src: alertmanager/alertmanager.yml.template
    dest: /etc/alertmanager/alertmanager.yml.template
    owner: alertmanager
    group: alertmanager
    mode: "0640"
  notify: Restart alertmanager
