---
# The "Restart <service>" handlers are defined in the monitoring_binaries role: list it before this one.
- name: Install envsubst (renders the Alertmanager config at each start)
  ansible.builtin.apt:
    name: gettext-base
    state: present

- name: Create the config and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: /etc/prometheus, owner: prometheus, group: prometheus }
    - { path: /etc/prometheus/rules, owner: root, group: root }
    - { path: /etc/loki, owner: loki, group: loki }
    - { path: /etc/alertmanager, owner: alertmanager, group: alertmanager }
    - { path: /var/lib/prometheus, owner: prometheus, group: prometheus }
    - { path: /var/lib/loki, owner: loki, group: loki }
    - { path: /var/lib/alertmanager, owner: alertmanager, group: alertmanager }
    - { path: /var/lib/node_exporter/textfile_collector, owner: root, group: root }
  loop_control:
    label: "{{ item.path }}"

- name: Install the systemd units
  ansible.builtin.include_tasks: units.yml

- name: Install the service secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Install the service configurations
  ansible.builtin.include_tasks: configs.yml

- name: Enable and start the services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [prometheus, alertmanager, node_exporter, loki]

# Reconcile, do not only notify: a service whose unit file or drop-in is newer than its running
# process never picked up the change (v0.1.38: node_exporter kept --collector.ntp after its unit changed).
- name: Find observability services running an older unit than the one on disk
  ansible.builtin.shell: |
    set -eu
    now=$(date +%s)
    for s in prometheus alertmanager node_exporter loki; do
      pid=$(systemctl show -p MainPID --value "$s")
      [ "$pid" -gt 0 ] || continue
      started=$(( now - $(ps -o etimes= -p "$pid" | tr -d ' ') ))
      newest=$(find "/etc/systemd/system/$s.service" "/etc/systemd/system/$s.service.d" -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -n 1 | cut -d. -f1)
      if [ -n "$newest" ] && [ "$newest" -gt "$started" ]; then echo "$s"; fi
    done
  args:
    executable: /bin/bash
  register: observability_stale_services
  changed_when: false
  check_mode: false

- name: Restart observability services running an older unit
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ observability_stale_services.stdout_lines }}"

# A rejected reload keeps the previous configuration running silently: apply the pending
# restarts and reloads now, then fail the run unless Prometheus accepted its configuration.
- name: Apply pending restarts and reloads before checking Prometheus
  ansible.builtin.meta: flush_handlers

- name: Prometheus accepted its configuration (last reload successful)
  # Live value from /metrics: the query API returns the last self-scrape, which can still show 1 after a rejected reload
  ansible.builtin.command: "curl -sf http://127.0.0.1:9090/metrics"
  register: observability_reload_state
  changed_when: false
  check_mode: false
  retries: 20
  delay: 3
  until: observability_reload_state.rc == 0 and observability_reload_state.stdout is search('(?m)^prometheus_config_last_reload_successful 1$')
