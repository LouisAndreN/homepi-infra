---
- name: Create the Prometheus secrets directory
  ansible.builtin.file:
    path: /etc/prometheus/secrets
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: Install the Grafana scrape password (decrypted on the controller with SOPS)
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', playbook_dir + '/secrets/monitoring.sops.yaml', extract='[\"grafana_scrape_password\"]') }}"
    dest: /etc/prometheus/secrets/grafana_scrape_password
    owner: root
    group: prometheus
    mode: "0640"
  no_log: true
  notify: Reload prometheus
