# promtool test rules logship_test.yml (from this directory)
rule_files:
  - ../rules/logship.yml
evaluation_interval: 1m
tests:
  - interval: 5m
    input_series:
      - series: homepi_logship_success
        values: '1 1 0 0 0 0 0 0 0'
      - series: homepi_logship_last_run_timestamp_seconds
        values: '0 300 600 900 1200 1500 1800 2100 2400'
    alert_rule_test:
      - eval_time: 20m
        alertname: PiLogShipFailing
        exp_alerts: []
      - eval_time: 41m
        alertname: PiLogShipFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Security logs have not left the Pi for at least 30 minutes"
              description: "The entries wait in the journal and are sent from the same cursor at the next success. Check: journalctl -u homepi-log-ship -n 20; systemctl status homepi-aws-edge-renew.timer (certificate)."
      - eval_time: 40m
        alertname: PiLogShipStale
        exp_alerts: []
  - interval: 5m
    input_series:
      - series: homepi_logship_last_run_timestamp_seconds
        values: '0 300 300 300 300 300 300 300 300 300 300 300'
    alert_rule_test:
      - eval_time: 30m
        alertname: PiLogShipStale
        exp_alerts: []
      - eval_time: 45m
        alertname: PiLogShipStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The log shipping timer has not run for 30 minutes"
              description: "A stopped homepi-log-ship.timer is what an intruder would do first. Check: systemctl list-timers homepi-log-ship.timer."
  - interval: 5m
    input_series:
      - series: up{job="node"}
        values: '1x10'
    alert_rule_test:
      - eval_time: 40m
        alertname: PiLogShipMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "No metrics from the log shipping: it never ran or its metrics file is gone"
              description: "Check /var/lib/node_exporter/textfile_collector/homepi_logship.prom and the timer."
