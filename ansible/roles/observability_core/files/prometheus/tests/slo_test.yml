# promtool test rules slo_test.yml (from this directory): docs/slo.md
rule_files:
  - ../rules/slo.yml
evaluation_interval: 1m
tests:
  # Ingestion stops after 3 hours: the fast burn fires within about 10 minutes (InfluxWritesStopped
  # needs 25), the slow burn after its 15 minutes of "for"
  - interval: 1m
    input_series:
      - series: 'http_api_requests_total{job="influxdb",path="/api/v2/write",user_agent="Telegraf",status="2XX",response_code="204"}'
        values: '0+10x180 1810x90'
      - series: 'node_systemd_unit_state{instance="pi",job="node_exporter",name="homepi-api.service",state="active",type="simple"}'
        values: '1x270'
    alert_rule_test:
      - eval_time: 180m
        alertname: SloIngestBurnFast
        exp_alerts: []
      - eval_time: 192m
        alertname: SloIngestBurnFast
        exp_alerts:
          - exp_labels: {severity: critical, slo: ingest}
            exp_annotations:
              summary: "Ingestion SLO burning 14x: about 2% of the 28-day budget in one hour"
              description: "Bad minutes in the last hour: 18.33% (SLO 99.5%). Short outages or flapping that the per-service alerts may not catch. docs/slo.md; docs/runbooks/telegraf.md"
      - eval_time: 192m
        alertname: SloIngestBurnSlow
        exp_alerts: []
      - eval_time: 215m
        alertname: SloIngestBurnSlow
        exp_alerts:
          - exp_labels: {severity: warning, slo: ingest}
            exp_annotations:
              summary: "Ingestion SLO burning 6x: about 5% of the 28-day budget in six hours"
              description: "Bad minutes in the last 6 hours: 9.444% (SLO 99.5%). docs/slo.md; docs/runbooks/telegraf.md"
      - eval_time: 205m
        alertname: SloApiBurnFast
        exp_alerts: []
    promql_expr_test:
      # 3 hours good: nothing spent
      - expr: homepi:slo_ingest_error_ratio:1h
        eval_time: 180m
        exp_samples:
          - labels: 'homepi:slo_ingest_error_ratio:1h'
            value: 0
      # stopped at 180 min, last increase seen at 181: bad from 182 to 240 = 59 minutes of 60
      - expr: homepi:slo_ingest_error_ratio:1h
        eval_time: 240m
        exp_samples:
          - labels: 'homepi:slo_ingest_error_ratio:1h'
            value: 0.9833333333333333
  # A 4-minute pause (a restart) spends budget and alerts nobody
  - interval: 1m
    input_series:
      - series: 'http_api_requests_total{job="influxdb",path="/api/v2/write",user_agent="Telegraf",status="2XX",response_code="204"}'
        values: '0+10x120 1210x3 1220+10x60'
    alert_rule_test:
      - eval_time: 150m
        alertname: SloIngestBurnFast
        exp_alerts: []
    promql_expr_test:
      - expr: homepi:slo_ingest_error_ratio:1h
        eval_time: 150m
        exp_samples:
          - labels: 'homepi:slo_ingest_error_ratio:1h'
            value: 0.05
  # The InfluxDB write series is gone (InfluxDB down, scrape failing): every minute is bad
  - interval: 1m
    input_series:
      - series: 'up{job="influxdb"}'
        values: '0x30'
    promql_expr_test:
      - expr: homepi:slo_ingest_good:1m
        eval_time: 10m
        exp_samples:
          - labels: 'homepi:slo_ingest_good:1m'
            value: 0
  # The API flaps (2 minutes down, 2 up): HomepiApiDown needs 5 minutes in a row and never fires;
  # half the minutes are bad, so the fast burn does
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{instance="pi",job="node_exporter",name="homepi-api.service",state="active",type="simple"}'
        values: '1x60 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1 0x1 1x1'
    alert_rule_test:
      - eval_time: 60m
        alertname: SloApiBurnFast
        exp_alerts: []
      - eval_time: 100m
        alertname: SloApiBurnFast
        exp_alerts:
          - exp_labels: {severity: critical, slo: api}
            exp_annotations:
              summary: "Device API SLO burning 14x: about 2% of the 28-day budget in one hour"
              description: "Bad minutes in the last hour: 33.33% (SLO 99.0%). Short outages or flapping that the per-service alerts may not catch. docs/slo.md; docs/runbooks/nginx-api.md"
  # The 2026-11-22 incident: the API down 9 hours. Budget 403 minutes in 28 days: spent by a third more
  # (538 bad minutes counted of 540: the 28-day rules run every 5 minutes on the elapsed minutes of the
  # previous 1-minute evaluation; a minute or two either way does not change a 28-day budget)
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{instance="pi",job="node_exporter",name="homepi-api.service",state="active",type="simple"}'
        values: '1x60 0x540 1x120'
    promql_expr_test:
      - expr: homepi:slo_api_budget_remaining:28d
        eval_time: 600m
        exp_samples:
          - labels: 'homepi:slo_api_budget_remaining:28d'
            value: -0.33432539682539675
    alert_rule_test:
      - eval_time: 500m
        alertname: SloApiBudgetExhausted
        exp_alerts: []
      - eval_time: 600m
        alertname: SloApiBudgetExhausted
        exp_alerts:
          - exp_labels: {severity: warning, slo: api}
            exp_annotations:
              summary: "Device API SLO: 28-day error budget spent"
              description: "Policy (docs/slo.md): no release that is not a fix for this SLO until the budget is positive again."
