global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['127.0.0.1:9100']
    metrics_path: /metrics

  - job_name: 'influxdb'
    static_configs:
      - targets: ['127.0.0.1:8086']
    metrics_path: /metrics

  - job_name: 'grafana'
    static_configs:
      - targets: ['127.0.0.1:3001']
    metrics_path: /grafana/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/grafana_scrape_password

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['127.0.0.1:9093']

  - job_name: 'loki'
    static_configs:
      - targets: ['127.0.0.1:3100']
    metrics_path: /metrics

  - job_name: 'alloy'
    static_configs:
      - targets: ['127.0.0.1:12345']
    metrics_path: /metrics

  - job_name: 'crowdsec'
    static_configs:
      - targets: ['127.0.0.1:6060']

  - job_name: 'homepi_devices'
    # 1 minute since v0.1.113 (was 1h): DeviceSilent needs a fresh last_seen
    scrape_interval: 1m
    static_configs:
      - targets: ['127.0.0.1:3001']
    metrics_path: /metrics/homepi

  - job_name: 'authelia'
    static_configs:
      - targets: ['127.0.0.1:9959']


rule_files:
   - /etc/prometheus/rules/*.yml

# Without this section Prometheus evaluates alerts but sends them nowhere
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
