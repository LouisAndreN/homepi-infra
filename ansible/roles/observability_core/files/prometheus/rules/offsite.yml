# Managed by Ansible (observability_core). Off-site copies in S3 (Object Lock), uploaded hourly by
# homepi-offsite.timer. A backup that only exists on the Pi is lost with the Pi.
groups:
  - name: homepi-offsite
    rules:
      - alert: OffsiteStateTooOld
        expr: time() - homepi_offsite_last_success_timestamp_seconds{kind="state"} > 36 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No state backup copied off-site for more than 36 hours"
          description: "Read: journalctl -u homepi-offsite.service. Check the timer, DNS, the edge certificate and the network."

      - alert: OffsiteInfluxTooOld
        expr: time() - homepi_offsite_last_success_timestamp_seconds{kind="influx-lp"} > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No InfluxDB export copied off-site for more than 8 days"
          description: "Read: journalctl -u homepi-offsite.service"

      - alert: OffsiteInfluxNativeTooOld
        expr: time() - homepi_offsite_last_success_timestamp_seconds{kind="influx-native"} > 36 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No native InfluxDB backup uploaded off-site for more than 36 hours"
          description: "Read: journalctl -u homepi-offsite.service (hourly); the archive must have a .offsite marker"

      - alert: OffsiteInfluxDeltaTooOld
        expr: time() - homepi_offsite_last_success_timestamp_seconds{kind="influx-delta"} > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No sensor delta uploaded off-site for more than 3 hours: a dead disk now loses more than 1 hour"
          description: "Read: journalctl -u homepi-offsite.service. Deltas are uploaded oldest first; the first failure stops the run."

      - alert: OffsiteUploadFailing
        expr: homepi_offsite_upload_success == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Off-site upload of {{ $labels.kind }} keeps failing"
          description: "At least two hourly attempts failed. Read: journalctl -u homepi-offsite.service"

      - alert: OffsiteMetricsMissing
        expr: absent(homepi_offsite_last_success_timestamp_seconds{kind="state"}) or absent(homepi_offsite_last_success_timestamp_seconds{kind="influx-lp"}) or absent(homepi_offsite_last_success_timestamp_seconds{kind="influx-native"}) or absent(homepi_offsite_last_success_timestamp_seconds{kind="influx-delta"})
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "No {{ $labels.kind }} off-site metrics: the upload never ran or its metrics file is gone"
          description: "Read: systemctl status homepi-offsite.timer; journalctl -u homepi-offsite.service"
