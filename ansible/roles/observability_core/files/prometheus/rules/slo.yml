# Service level objectives (docs/slo.md). Two SLOs, 28-day rolling window, time-based SLIs: one sample
# per minute, 1 = good. Error ratio over a window = bad minutes / minutes in the window, where bad =
# minutes elapsed in the window minus good samples: a minute with no sample (the Pi or Prometheus
# down, a missed evaluation) counts as bad. Minutes before homepi:slo_start_timestamp_seconds count as
# good, so the budget is always 1% (or 0.5%) of 28 full days, from the first day. Burn-rate alerts
# after the SRE workbook (multiwindow, multi-burn-rate). Every SLO alert carries an slo label: R6
# does not count them (an error budget is history, not current health).
# Tests: tests/slo_test.yml.
groups:
  - name: slo_start
    interval: 5m
    rules:
      # The first evaluation of these rules on this TSDB: minutes before it are not counted (they predate
      # the SLI, or the TSDB itself after a rebuild). last_over_time keeps it across a Pi outage up to 35 days.
      - record: homepi:slo_start_timestamp_seconds
        expr: last_over_time(homepi:slo_start_timestamp_seconds[35d]) or vector(time())
      - record: homepi:slo_ingest_error_ratio:28d
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 40320) - (sum_over_time(homepi:slo_ingest_good:1m[28d]) or vector(0)), 0) / 40320
      - record: homepi:slo_ingest_budget_remaining:28d
        expr: 1 - homepi:slo_ingest_error_ratio:28d / 0.005
      - record: homepi:slo_api_error_ratio:28d
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 40320) - (sum_over_time(homepi:slo_api_good:1m[28d]) or vector(0)), 0) / 40320
      - record: homepi:slo_api_budget_remaining:28d
        expr: 1 - homepi:slo_api_error_ratio:28d / 0.01
  - name: slo_sli
    interval: 1m
    rules:
      - record: homepi:slo_elapsed_minutes
        expr: (time() - scalar(homepi:slo_start_timestamp_seconds)) / 60
      # ingest SLO 99.5%: a minute is good when InfluxDB accepted at least one Telegraf write in the last 2 minutes
      - record: homepi:slo_ingest_good:1m
        expr: ((sum(rate(http_api_requests_total{job="influxdb",path="/api/v2/write",user_agent="Telegraf",status="2XX"}[2m])) > bool 0) or on() vector(0))
      - record: homepi:slo_ingest_error_ratio:5m
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 5) - (sum_over_time(homepi:slo_ingest_good:1m[5m]) or vector(0)), 0) / 5
      - record: homepi:slo_ingest_error_ratio:30m
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 30) - (sum_over_time(homepi:slo_ingest_good:1m[30m]) or vector(0)), 0) / 30
      - record: homepi:slo_ingest_error_ratio:1h
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 60) - (sum_over_time(homepi:slo_ingest_good:1m[1h]) or vector(0)), 0) / 60
      - record: homepi:slo_ingest_error_ratio:6h
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 360) - (sum_over_time(homepi:slo_ingest_good:1m[6h]) or vector(0)), 0) / 360
      # api SLO 99.0%: a minute is good when homepi-api.service is active
      - record: homepi:slo_api_good:1m
        expr: (max(node_systemd_unit_state{name="homepi-api.service",state="active"}) or on() vector(0))
      - record: homepi:slo_api_error_ratio:5m
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 5) - (sum_over_time(homepi:slo_api_good:1m[5m]) or vector(0)), 0) / 5
      - record: homepi:slo_api_error_ratio:30m
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 30) - (sum_over_time(homepi:slo_api_good:1m[30m]) or vector(0)), 0) / 30
      - record: homepi:slo_api_error_ratio:1h
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 60) - (sum_over_time(homepi:slo_api_good:1m[1h]) or vector(0)), 0) / 60
      - record: homepi:slo_api_error_ratio:6h
        expr: clamp_min(clamp_max(homepi:slo_elapsed_minutes, 360) - (sum_over_time(homepi:slo_api_good:1m[6h]) or vector(0)), 0) / 360
  - name: slo_alerts
    rules:
      # ingest: budget 0.005 of 28 days = 202 minutes
      - alert: SloIngestBurnFast
        expr: homepi:slo_ingest_error_ratio:1h > 0.072 and homepi:slo_ingest_error_ratio:5m > 0.072
        for: 2m
        labels:
          severity: critical
          slo: ingest
        annotations:
          summary: "Ingestion SLO burning 14x: about 2% of the 28-day budget in one hour"
          description: "Bad minutes in the last hour: {{ $value | humanizePercentage }} (SLO 99.5%). Short outages or flapping that the per-service alerts may not catch. docs/slo.md; docs/runbooks/telegraf.md"
      - alert: SloIngestBurnSlow
        expr: homepi:slo_ingest_error_ratio:6h > 0.03 and homepi:slo_ingest_error_ratio:30m > 0.03
        for: 15m
        labels:
          severity: warning
          slo: ingest
        annotations:
          summary: "Ingestion SLO burning 6x: about 5% of the 28-day budget in six hours"
          description: "Bad minutes in the last 6 hours: {{ $value | humanizePercentage }} (SLO 99.5%). docs/slo.md; docs/runbooks/telegraf.md"
      - alert: SloIngestBudgetExhausted
        expr: homepi:slo_ingest_budget_remaining:28d <= 0
        for: 1h
        labels:
          severity: warning
          slo: ingest
        annotations:
          summary: "Ingestion SLO: 28-day error budget spent"
          description: "Policy (docs/slo.md): no release that is not a fix for this SLO until the budget is positive again."
      # api: budget 0.01 of 28 days = 403 minutes
      - alert: SloApiBurnFast
        expr: homepi:slo_api_error_ratio:1h > 0.144 and homepi:slo_api_error_ratio:5m > 0.144
        for: 2m
        labels:
          severity: critical
          slo: api
        annotations:
          summary: "Device API SLO burning 14x: about 2% of the 28-day budget in one hour"
          description: "Bad minutes in the last hour: {{ $value | humanizePercentage }} (SLO 99.0%). Short outages or flapping that the per-service alerts may not catch. docs/slo.md; docs/runbooks/nginx-api.md"
      - alert: SloApiBurnSlow
        expr: homepi:slo_api_error_ratio:6h > 0.06 and homepi:slo_api_error_ratio:30m > 0.06
        for: 15m
        labels:
          severity: warning
          slo: api
        annotations:
          summary: "Device API SLO burning 6x: about 5% of the 28-day budget in six hours"
          description: "Bad minutes in the last 6 hours: {{ $value | humanizePercentage }} (SLO 99.0%). docs/slo.md; docs/runbooks/nginx-api.md"
      - alert: SloApiBudgetExhausted
        expr: homepi:slo_api_budget_remaining:28d <= 0
        for: 1h
        labels:
          severity: warning
          slo: api
        annotations:
          summary: "Device API SLO: 28-day error budget spent"
          description: "Policy (docs/slo.md): no release that is not a fix for this SLO until the budget is positive again."
