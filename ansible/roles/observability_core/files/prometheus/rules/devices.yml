groups:
  - name: devices
    rules:
      # v0.1.57: device identity activity (homepi-device-metrics, docs/runbooks/nginx-api.md)
      - alert: DeviceEnrollmentBurst
        expr: homepi_stepca_requests{endpoint="sign",window="1h"} > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} certificate sign requests on step-ca in the last hour"
          description: "Seven devices almost never sign. A burst means a re-enrollment loop (2026-11-07: 232 in a day, after 3 MQTT disconnects per device) or an unexpected enrollment. Check: journalctl -u step-ca --since -1h | grep /1.0/sign, and the MQTT connections on 8883."
      - alert: DeviceApiRefusals
        expr: sum(homepi_device_requests{status_class=~"4xx|5xx"}) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} refused device requests from the IoT network in the last hour"
          description: "Devices call routes that refuse them: the frozen x5c-enrolled and renew, a certificate problem, or a client that is not a HomePi device. Check: grep '^192.168.200' /var/log/nginx/access.log | tail -20."
      # v0.1.119: the broker refuses a client whose certificate is revoked, expired or not ours. A device
      # in that state retries every few seconds; the refusals were only in mosquitto.log (2026-11-15:
      # 171 in 3 minutes while every device was refused, and nothing alerted).
      - alert: BrokerClientCertificateRefused
        expr: homepi_broker_tls_refusals{window="1h"} > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The MQTT broker refused {{ $value }} client certificates in the last hour"
          description: "A device with a revoked, expired or foreign certificate is retrying, or the CRL rejects valid clients. Check: grep 'certificate verify failed' /var/log/mosquitto/mosquitto.log | tail; the DeviceSilent alerts tell which device; docs/runbooks/pki.md."
      # v0.1.120: signed OTA rollouts (apps/api/rollout.py, docs/runbooks/ota.md)
      - alert: OtaRolloutAborted
        expr: homepi_rollouts_aborted{window="24h"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} OTA rollout(s) aborted in the last 24 hours"
          description: "A device refused the image, rolled it back or went silent: the next phases were not sent. Check: the dashboard Fleet tab or GET /api/admin/rollouts (reason per device)."
      - alert: OtaRolloutStuck
        expr: time() - homepi_rollout_started_timestamp_seconds > 6 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OTA rollout of {{ $labels.project }} {{ $labels.version }} in progress for more than 6 hours (phase {{ $labels.phase }})"
          description: "homepi-ota-rollout.timer moves rollouts every minute; a phase lasts at most the timeout plus the soak time. Check: systemctl status homepi-ota-rollout.timer; journalctl -u homepi-ota-rollout -n 20."
      - alert: OtaCommandRefused
        expr: homepi_ota_failed_reports{window="24h"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} OTA command(s) refused or failed on a device in the last 24 hours"
          description: "Firmware v2.4.1+ refuses any OTA command that is not signed by the OTA key, not newer, or for another project or chip. Outside a rollout, someone or something published an OTA command. Check: SELECT * FROM ota_events ORDER BY id DESC LIMIT 5 (devices.db), and the audit log."
      - alert: DeviceMetricsStale
        expr: (time() - homepi_device_metrics_last_run_timestamp_seconds > 1800) or (homepi_device_metrics_success == 0) or absent(homepi_device_metrics_last_run_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Device identity metrics are stale or failing"
          description: "homepi-device-metrics.timer runs every 5 minutes. Check: systemctl status homepi-device-metrics.timer; journalctl -u homepi-device-metrics -n 20."
      # v0.1.113: no alert fired while the registry was frozen (2026-11-09 to 11-12) nor during the
      # 39 h collection gap of 2026-09-26. Every device is covered since v0.1.119: the LED controller
      # sends a heartbeat every 5 minutes from firmware v2.4.0 (it published only on reconnection).
      - alert: DeviceSilent
        expr: (time() - homepi_device_last_seen_timestamp_seconds{status=~"active|approved|pre_announced"}) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device_id }} has sent no telemetry for {{ $value | humanizeDuration }}"
          description: "Sensors publish every 30 s, the NILM bridge several times a second. Check: iw dev wlx0013eff27090 station dump; journalctl -u homepi-api --since -15min; the device's power."
      - alert: DevicesMetricsMissing
        expr: up{job="homepi_devices"} == 0 or absent(homepi_device_last_seen_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No device registry metrics: DeviceSilent cannot fire"
          description: "Prometheus scrapes /metrics/homepi on the device API every minute. Check: systemctl status homepi-api homepi-api.socket; curl -s http://127.0.0.1:3001/metrics/homepi | head"
      # v0.1.114: a device with a valid LDevID that is not in the registry is recorded as pending
      - alert: DevicePendingApproval
        expr: homepi_devices_by_status{status="pending"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} device(s) registered without being pre-announced: waiting for an operator"
          description: "An unknown device presented a valid LDevID. Approve it (POST /api/admin/devices/<id>/confirm) only if you flashed it; otherwise revoke its certificate (step ca revoke) and suspend it."
