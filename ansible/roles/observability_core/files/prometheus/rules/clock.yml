groups:
  - name: clock
    rules:
      # Clock health from the kernel (timex collector), not from an NTP query:
      # step-ca short-lived certificates, Roles Anywhere SigV4 (5 min skew limit) and Authelia TOTP (30 s) all depend on it.
      - alert: NodeClockNotSynchronising
        expr: min_over_time(node_timex_sync_status[5m]) == 0 and node_timex_maxerror_seconds >= 16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock not synchronised on {{ $labels.instance }}"
          description: "The kernel reports no time synchronisation for 10 min (max error {{ $value }}). Check chrony: chronyc tracking, chronyc sources."
      - alert: NodeClockSkewDetected
        expr: >-
          (node_timex_offset_seconds > 0.05 and deriv(node_timex_offset_seconds[5m]) >= 0)
          or (node_timex_offset_seconds < -0.05 and deriv(node_timex_offset_seconds[5m]) <= 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew on {{ $labels.instance }}"
          description: "Clock offset above 50 ms and not improving for 10 min. mTLS, SigV4 and TOTP fail beyond their skew limits."
