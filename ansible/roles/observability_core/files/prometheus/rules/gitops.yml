groups:
  - name: homepi-gitops
    rules:
      - alert: GitopsApplyFailing
        expr: homepi_gitops_apply_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The Pi cannot apply its release tag"
          description: "homepi-gitops-sync apply has failed for 15 minutes. Read: journalctl -u homepi-gitops@apply.service"

      # A tag that failed twice in a row is no longer retried (homepi-gitops-sync, hold). Production stays
      # on the deployed tag; nobody acts at night (docs/adr/0001-no-night-response.md), so the hold is
      # what bounds the damage of a bad release, and this alert says why GitOps went quiet.
      - alert: GitopsTagHeld
        expr: homepi_gitops_apply_held == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A release tag is held after repeated failed applies"
          description: "GitOps no longer retries it; production stays on the deployed tag. Fix and release a newer tag, or fix the cause on the Pi and run: sudo homepi-gitops-sync retry (docs/runbooks/laptop.md)."

      - alert: GitopsUntrustedTag
        expr: homepi_gitops_untrusted_tags > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A release tag without a trusted signature exists"
          description: "{{ $value }} tag(s) were skipped because no key in allowed_signers signed them."

      - alert: GitopsDrift
        expr: homepi_gitops_drift_changed_tasks > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The Pi differs from its deployed release"
          description: "{{ $value }} task(s) would change if the deployed release were applied again."

      - alert: GitopsSilent
        expr: time() - homepi_gitops_apply_timestamp_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No reconciliation run for over an hour"
          description: "The apply timer is stopped or failing silently."

      - alert: GitopsCheckSilent
        expr: time() - homepi_gitops_check_timestamp_seconds > 10800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No drift check for over three hours"
          description: "The check timer is stopped or the check keeps failing."

      - alert: GitopsMetricsMissing
        expr: absent(homepi_gitops_apply_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The reconciler exports no metrics"
          description: "The textfile of homepi-gitops-sync is missing or node_exporter does not read it."

      - alert: GitopsTerraformFailing
        expr: homepi_gitops_terraform_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The Terraform step of the reconciler is failing"
          description: "Init, plan, apply or the destroy guard failed. Read: journalctl -u homepi-gitops@apply.service"

      - alert: GitopsTerraformDrift
        expr: homepi_gitops_terraform_planned_changes > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Grafana differs from its Terraform code"
          description: "{{ $value }} Grafana object(s) would change if Terraform were applied again."
      # A check run that fails is how the storage role reports drift (it fails on purpose): without this
      # rule, the hourly check detected storage drift and nobody was told (found 2026-11-07).
      - alert: GitopsCheckFailing
        expr: homepi_gitops_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The hourly GitOps check of the deployed tag failed"
          description: "The check-mode run of the deployed tag failed, for example on storage drift. Read: journalctl -u homepi-gitops@check --since -2h. Storage drift is repaired by hand with storage.yml (docs/runbooks/storage.md)."
