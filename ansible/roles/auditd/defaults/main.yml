auditd_keys: [identity, sudoers, ssh-keys, ssh-config, firewall-rules, crowdsec-config, hostapd_config,
              dnsmasq_config, netbird_config, unbound_config, ca-config, ca-secrets, service-secrets,
              mqtt-auth, homepi-config, systemd-units, exec, network_connect, mount_operations]
# 30 x 100 MB on lv-logs (30 GB, 1.8 GB used on 2026-11-25): about two weeks locally at the measured
# volume without the systemd mount records, longer than the 7 days of Loki
auditd_max_log_file_mb: 100
auditd_num_logs: 30
