---
# The API code is deployed from apps/api (one source of truth) with a one-time database migration and an
# automatic rollback of code and database; units, secrets, Python packages and services are verified only.
# devices.db runs in WAL mode: every sqlite access runs as homepi-api so the -wal and -shm files keep
# belonging to the API user.

# Rebuild only (C1, docs/runbooks/restore.md): a host restored from backup has no virtualenv (the
# state archive excludes it). Built from requirements.lock when missing; on a running Pi it exists
# and both tasks are skipped, so the packages stay verified-only as before.
- name: API virtualenv present? (read-only)
  ansible.builtin.stat:
    path: /opt/homepi/api-venv/bin/python
  register: api_venv_python

- name: Build the API virtualenv from requirements.lock (missing, rebuilt host)
  when: not api_venv_python.stat.exists and not ansible_check_mode
  block:
    - name: Copy requirements.lock for the build
      ansible.builtin.copy:
        src: requirements.lock
        dest: /opt/homepi/api-requirements.lock
        owner: root
        group: root
        mode: "0644"

    - name: Create the virtualenv and install the locked packages
      ansible.builtin.shell: |
        set -e
        python3 -m venv /opt/homepi/api-venv
        /opt/homepi/api-venv/bin/pip install --no-input --disable-pip-version-check -q -r /opt/homepi/api-requirements.lock
      args:
        executable: /bin/bash
      changed_when: true

- name: API code from apps/api differs from the Pi? (check mode only)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ api_code_files }}"
  loop_control:
    label: "{{ item.dest }}"
  check_mode: true
  register: api_code_probe

# WAL needs devices.db-wal and devices.db-shm, and SQLite creates them in the database directory,
# which homepi-api cannot write. On production they exist since the API first ran; a restored Pi
# has none (R3 restores the .db only), so every access as homepi-api failed with "attempt to write
# a readonly database" (C3, 2026-11-21). Empty files owned by the API user are valid side files;
# SQLite cannot unlink them here, so they stay. Existing files are left as they are.
- name: WAL side files of the device database exist, owned by the API user
  ansible.builtin.file:
    path: "{{ api_db }}-{{ item }}"
    state: touch
    owner: homepi-api
    group: homepi-api
    mode: "0644"
    access_time: preserve
    modification_time: preserve
  loop: [wal, shm]

- name: Database schema version (read-only, as the API user)
  ansible.builtin.command:
    argv: [runuser, -u, homepi-api, --, sqlite3, -readonly, "{{ api_db }}", "PRAGMA user_version;"]
  check_mode: false
  changed_when: false
  register: api_db_version

- name: Deploy the API code and migrate the database, rolling back on any failure
  when: api_code_probe is changed or (api_db_version.stdout | int) < api_db_target_version
  block:
    - name: Stop the API services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: [homepi-api-admin.socket, homepi-api.socket, homepi-api-admin, homepi-api]

    - name: Backup directory owned by the API user
      ansible.builtin.file:
        path: "{{ api_db_backup | dirname }}"
        state: directory
        owner: homepi-api
        group: homepi-api
        mode: "0700"

    - name: Back up the database as the API user (consistent sqlite copy)
      ansible.builtin.command:
        argv: [runuser, -u, homepi-api, --, sqlite3, "{{ api_db }}", ".backup '{{ api_db_backup }}'"]
      changed_when: true
      register: api_db_backup_done

    - name: Migration directory
      ansible.builtin.file:
        path: /opt/homepi/api/migrations
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Migration script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../apps/api/migrations/001_utc_timestamps.py"
        dest: /opt/homepi/api/migrations/001_utc_timestamps.py
        owner: root
        group: root
        mode: "0644"

    - name: Migrate the database as the API user (once, in one transaction)
      ansible.builtin.command:
        argv: [runuser, -u, homepi-api, --, python3, /opt/homepi/api/migrations/001_utc_timestamps.py, "{{ api_db }}"]
      register: api_migration
      changed_when: api_migration.stdout is search('^migrated:')

    - name: API directory owned by root (the service must not rewrite its own code)
      ansible.builtin.file:
        path: /opt/homepi/api
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: No bytecode cache writable by the service
      ansible.builtin.file:
        path: /opt/homepi/api/__pycache__
        state: absent

    - name: Archive directory for removed files
      ansible.builtin.file:
        path: /root/homepi-removed/api
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Archive the stale June copy of the API
      ansible.builtin.command:
        argv: [mv, /opt/homepi/api/provisioning_api.py.save, /root/homepi-removed/api/provisioning_api.py.save]
        removes: /opt/homepi/api/provisioning_api.py.save

    - name: Install the API code
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ api_code_files }}"
      loop_control:
        label: "{{ item.dest }}"
      register: api_code_install

    # Enabled too: a rebuilt Pi has no enablement links (C3, 2026-11-21)
    - name: Start the API services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [homepi-api.socket, homepi-api-admin.socket, homepi-api, homepi-api-admin]

    - name: Both API sockets answer (device and admin surfaces)

      ansible.builtin.uri:

        url: "{{ item.url }}"

        unix_socket: "{{ item.socket }}"

        status_code: 200

      loop:

        - {socket: /run/homepi-api/device.sock, url: "http://localhost/api/devices/{{ api_health_device }}/status"}

        - {socket: /run/homepi-api/admin.sock, url: "http://localhost/api/admin/devices"}

      loop_control:

        label: "{{ item.socket }}"

      register: api_health

      retries: 15

      delay: 2

      until: api_health.status == 200

      when: not ansible_check_mode


    - name: Removed fallback routes answer 404 on the device surface

      ansible.builtin.uri:

        url: "http://localhost{{ item }}"

        unix_socket: /run/homepi-api/device.sock

        method: POST

        body_format: json

        body: {}

        status_code: 404

      loop: [/api/devices/enroll, /api/devices/announce, "/api/devices/{{ api_health_device }}/renew", /api/admin/pairing/open]

      when: not ansible_check_mode


  rescue:
    - name: Restore the previous API code
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ (api_code_install.results | default([])) | selectattr('backup_file', 'defined') | list }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Restore the database from the backup
      ansible.builtin.command:
        argv: [runuser, -u, homepi-api, --, sqlite3, "{{ api_db }}", ".restore '{{ api_db_backup }}'"]
      changed_when: true
      when: api_db_backup_done is defined and api_db_backup_done is succeeded

    - name: Start the API services again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [homepi-api.socket, homepi-api-admin.socket, homepi-api, homepi-api-admin]

    - name: Report the rollback
      ansible.builtin.fail:
        msg: >-
          API deployment failed and was rolled back (code and database):
          {{ ansible_failed_result.msg | default('see the failed task above') }}

- name: API virtualenv files not owned by root (the service must not rewrite its libraries)
  ansible.builtin.command:
    argv: [find, /opt/homepi/api-venv, "(", "!", -user, root, -o, "!", -group, root, ")", -print, -quit]
  check_mode: false
  register: api_venv_foreign
  changed_when: api_venv_foreign.stdout != ""

- name: API virtualenv owned by root
  ansible.builtin.command:
    argv: [chown, -R, root:root, /opt/homepi/api-venv]
  when: api_venv_foreign.stdout != ""

- name: API units match the repository (check mode only)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ api_files }}"
  loop_control:
    label: "{{ item.dest }}"
  check_mode: true
  register: api_files_state

- name: API secrets and state present with the expected owner and mode (content never read)
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
    get_mime: false
  loop: "{{ api_stat_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: api_stat_state

- name: Python packages of the API (read-only)
  ansible.builtin.command: "{{ api_pip }} freeze"
  check_mode: false
  changed_when: false
  register: api_pip_freeze

- name: API services enabled and running (check mode only)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ api_services }}"
  check_mode: true
  register: api_services_state

- name: Collect API drift
  ansible.builtin.set_fact:
    api_drift: >-
      {%- set d = [] -%}
      {%- for r in api_files_state.results if r is changed -%}{%- set _ = d.append(r.item.dest) -%}{%- endfor -%}
      {%- for r in api_stat_state.results -%}
      {%- if not r.stat.exists -%}{%- set _ = d.append(r.item.path ~ ' missing') -%}
      {%- elif r.stat.pw_name != r.item.owner or r.stat.gr_name != r.item.group or r.stat.mode != r.item.mode -%}{%- set _ = d.append(r.item.path ~ ' is ' ~ r.stat.pw_name ~ ':' ~ r.stat.gr_name ~ ' ' ~ r.stat.mode) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if (api_pip_freeze.stdout_lines | sort) != (lookup('ansible.builtin.file', 'requirements.lock').splitlines() | sort) -%}{%- set _ = d.append('Python packages differ from requirements.lock') -%}{%- endif -%}
      {%- for r in api_services_state.results if r is changed -%}{%- set _ = d.append('service ' ~ r.item) -%}{%- endfor -%}
      {{ d }}

- name: Show API drift
  ansible.builtin.debug:
    msg: "api drift: {{ api_drift | join(' | ') if api_drift else 'none' }}"

- name: Fail on API drift
  ansible.builtin.fail:
    msg: "API drift detected: {{ api_drift | join(' | ') }}. See docs/runbooks/nginx-api.md."
  when: api_drift | length > 0

- name: Device identity trust anchor (public certificate, content pinned, root owned)
  ansible.builtin.copy:
    src: ca/manufacturer_ca.crt
    dest: /etc/homepi/ca/manufacturer_ca.crt
    owner: root
    group: root
    mode: "0644"

- name: API checker
  ansible.builtin.copy:
    src: homepi-api-check
    dest: /usr/local/sbin/homepi-api-check
    owner: root
    group: root
    mode: "0755"
  register: api_checker

- name: API reachable only through its sockets, one surface each
  ansible.builtin.command:
    argv: [/usr/local/sbin/homepi-api-check, "{{ api_health_device }}"]
    chdir: /
  register: api_state
  changed_when: false
  check_mode: false
  retries: 5
  delay: 3
  until: api_state.rc == 0
  when: not (ansible_check_mode and (api_checker is changed or api_code_probe is changed))
