---
- name: HomePi base configuration
  hosts: pi_hosts
  become: true
  roles:
    - common
    - monitoring_binaries
    - observability_core
    - gitops_runtime
    - terraform_cli
    - homepi_tools
    - aws_edge
    - alloy
    - loki_housekeeping
    - dns
    - service_ordering
    - boot_chain
    # Verify only: never writes network files, never reloads (docs/runbooks/network.md)
    - network
    # Verify only: PKI and broker files, secrets by owner and mode (docs/runbooks/pki.md)
    - pki
    # Applies: keeps the broker CRL fresh (B3.2a, docs/runbooks/pki.md)
    - pki_crl
    # Verify only: nginx sites, snippets and TLS files (docs/runbooks/nginx-api.md)
    - nginx
    # Verify only: provisioning API code, units and Python packages
    - provisioning_api
    # Applies: device identity activity for Prometheus (v0.1.57)
    - device_metrics
    - dashboard
    # Verify only: the storage role fails on drift and never changes boot-critical files
    - storage
