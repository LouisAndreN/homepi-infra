---
- name: HomePi base configuration
  hosts: pi_hosts
  become: true
  roles:
    - common
    - packages
    - monitoring_binaries
    - observability_core
    - gitops_runtime
    - terraform_cli
    - homepi_tools
    - aws_edge
    - alloy
    - loki_housekeeping
    - dns
    - service_ordering
    - boot_chain
    # Applies, guarded: sshd listens on every address, rollback if a new connection fails
    - sshd
    # Applies: the IoT access point driver for every installed kernel (docs/runbooks/wifi-driver.md)
    - wifi_driver
    # Verify only: never writes network files, never reloads (docs/runbooks/network.md)
    - network
    # Verify only: PKI and broker files, secrets by owner and mode (docs/runbooks/pki.md)
    - pki
    # Applies: keeps the broker CRL fresh (B3.2a, docs/runbooks/pki.md)
    - pki_crl
    - mqtt_acl
    - influxdb
    - telegraf
    - grafana
    - authelia
    - crowdsec
    # Verify only: provisioning API code, units and Python packages
    - provisioning_api
    # nginx sites, snippets and TLS files (docs/runbooks/nginx-api.md). After authelia and
    # provisioning_api: its route checks need both backends (C4: on a first install the API answered
    # 502 and the portal 500, and the role rolled nginx back)
    - nginx
    # Applies: device identity activity for Prometheus (v0.1.57)
    - device_metrics
    # Applies: signed OTA, rollout timer and the signing public key (v0.1.120)
    - ota_rollout
    # Applies: power metrics and the hardware watchdog (v0.1.122, docs/runbooks/power.md)
    - power_metrics
    - auditd
    # Verify only: the storage role fails on drift and never changes boot-critical files
    - storage
    - dashboard
    # Verify only, last: it checks trees that other roles create (the dashboard releases, the API venv)
    - hardening
