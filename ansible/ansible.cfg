[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# B11: only the collections of ansible/requirements.yml, never those bundled with a system Ansible
collections_path = collections
collections_scan_sys_path = False
interpreter_python = auto_silent
forks = 5

[ssh_connection]
# Same fixed socket as ~/.ssh/config (no % tokens to interpret).
# The connection is opened by hand with `ssh homepi true`, so the key passphrase is typed once.
ssh_args = -o ControlMaster=auto -o ControlPersist=2h -o ControlPath=~/.ssh/cm-homepi -o BatchMode=yes
pipelining = True
