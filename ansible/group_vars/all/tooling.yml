---
# Tools the Pi needs to reconcile itself from signed tags (linux-arm64 builds)
gitops_tools:
  sops:
    version: "3.13.3"
    url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.arm64
    sha256: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
  # ansible-core 2.20 needs Python 3.12 or newer; the Pi runs 3.12.3
  ansible_core_version: "2.20.1"
  community_sops_version: "2.2.7"
  terraform:
    version: "1.17.0"
    url: https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_arm64.zip
    sha256: f32478134ffc6d710eec474bbd316652cdddc0f4e336973a3745e8d3a3309cdf
  # Pinned by terraform/grafana/.terraform.lock.hcl once the first init has run
  grafana_provider_version: "4.52.0"
  # IAM Roles Anywhere credential helper (AWS build for Amazon Linux 2023, runs on Ubuntu 24.04)
  aws_signing_helper:
    version: "1.8.5"
    url: https://rolesanywhere.amazonaws.com/releases/1.8.5/Aarch64/Linux/Amzn2023/aws_signing_helper
    sha256: 3d131aa888cd56da446f9c6bb460b1f0569f6c7edc74eae6193a2fe3928883ba
