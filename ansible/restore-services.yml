# Restore phase R3.5 (docs/runbooks/restore.md), run from the laptop after R5 and before R4:
#   ansible-playbook restore-services.yml
# R3 stops the services that own restored files, and the verify-only roles (network, pki) never start
# anything. C3 (2026-11-21) did all of this by hand; this playbook is that list, as code. It runs once
# on a rebuilt host: some tasks restart on purpose. Never run it on production.
---
- name: HomePi restore services (R3.5)
  hosts: pi_hosts
  become: true
  vars:
    # The IoT access point interface (roles/network/files/20-wlx.network)
    restore_iot_interface: wlx0013eff27090
  pre_tasks:
    - name: Refuse to run on the production disk
      ansible.builtin.shell: |
        set -o pipefail
        d=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)")
        sed 's/ *$//' "/sys/block/$d/device/model"
      args:
        executable: /bin/bash
      changed_when: false
      register: restore_disk_model

    - name: Stop if this is the Micron
      ansible.builtin.assert:
        that: "'Micron' not in restore_disk_model.stdout"
        fail_msg: "STOPPED: this is the production disk ({{ restore_disk_model.stdout }})"
        quiet: true
  roles:
    - wifi_driver
  tasks:
    - name: hostapd is not masked (the package masks it)
      ansible.builtin.systemd_service:
        name: hostapd
        masked: false

    - name: Restored nftables ruleset is valid before it is loaded
      ansible.builtin.command: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: nftables enabled and loaded
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

    # rules.v4/v6 (IoT NAT, NetBird DNS DNAT) were loaded at boot, before R3 restored them (C3 defect 37)
    - name: iptables-nft rules reloaded from the restored files
      ansible.builtin.systemd_service:
        name: netfilter-persistent
        enabled: true
        state: restarted

    # DKMS builds and installs the module but loads nothing: without this the IoT interface only appears
    # after a reboot, hostapd reports active without an interface and dnsmasq cannot bind
    # 192.168.200.1 (C4, R3.5)
    - name: IoT access point driver loaded
      ansible.builtin.command:
        argv: [modprobe, "{{ wifi_driver_module | default('88x2bu') }}"]
      changed_when: false

    - name: IoT interface present (the adapter enumerated by the driver)
      ansible.builtin.command:
        argv: [ip, link, show, "{{ restore_iot_interface }}"]
      register: restore_iot_link
      changed_when: false
      retries: 20
      delay: 3
      until: restore_iot_link.rc == 0

    - name: systemd-networkd enabled and running
      ansible.builtin.systemd_service:
        name: systemd-networkd
        enabled: true
        state: started

    # Restarted, not only started: hostapd may already run from before the interface existed
    - name: hostapd enabled and restarted on the interface
      ansible.builtin.systemd_service:
        name: hostapd
        enabled: true
        state: restarted

    - name: IoT interface holds 192.168.200.1 (set by systemd-networkd once hostapd brought it up)
      ansible.builtin.shell: ip -4 -o addr show dev {{ restore_iot_interface }} | grep -q ' 192.168.200.1/'
      register: restore_iot_addr
      changed_when: false
      retries: 20
      delay: 3
      until: restore_iot_addr.rc == 0

    - name: dnsmasq enabled and running (it binds 192.168.200.1 only)
      ansible.builtin.systemd_service:
        name: dnsmasq
        enabled: true
        state: started

    # NetBird adds its own tables: restart it after the firewall so they exist
    - name: NetBird enabled and restarted after the firewall
      ansible.builtin.systemd_service:
        name: netbird
        enabled: true
        state: restarted

    - name: PKI services and renewal timers enabled and running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [step-ca, step-renew.timer, step-renew-mosquitto.timer]

    - name: IoT NAT rule present (the ESP32s reach NTP and HTTPS through it)
      ansible.builtin.shell: iptables -t nat -S POSTROUTING | grep -c -- '-o eth0 -j MASQUERADE'
      changed_when: false

    - name: Every service of this phase is active
      ansible.builtin.command:
        argv: [systemctl, is-active, nftables, hostapd, dnsmasq, netbird, step-ca, systemd-networkd]
      changed_when: false
